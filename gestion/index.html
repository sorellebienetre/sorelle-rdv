  var svcs = S.cfg.services;
  function grp(cat, label, icon) {
    var list = svcs.filter(function (s) { return s.categorie === cat; });

    return '<div class="opt-g">' + icon + '<span>' + label + '</span></div><div class="opts">' + list.map(function (s) {
      return '<button type="button" class="opt' + (st[cat] === s.id ? ' on' : '') + '" data-act="pick" data-cat="' + cat + '" data-id="' + esc(s.id) + '" aria-pressed="' + (st[cat] === s.id) + '">' + esc(s.nom) + '<small>' + dur(s.duree) + '</small></button>';
    }).join('') + '</div>';
  }
  return grp('main', 'Mains, au poste (1 max)', I.hand) + grp('pied', 'Pieds, en cabine (1 max)', I.foot);

function pickedServices(st) { return [st.main, st.pied].filter(Boolean); }
function pratSeg(cur, k) {

    return '<button type="button" class="' + (cur === p.id ? 'on' : '') + '" data-act="set" data-k="' + (k || 'prat') + '" data-v="' + p.id + '" aria-pressed="' + (cur === p.id) + '">' + pdot(p.id, 'sm') + esc(p.nom) + '</button>';

function defaultPrat() {
  if (G.filtre.prat !== 'tous' && activePrats().some(function (p) { return p.id === G.filtre.prat; })) return G.filtre.prat;
  var p = activePrats()[0]; return p ? p.id : 'laurie';
}

/* ---- Liste de créneaux (jour choisi) ---- */
function slotsHTML(st) {

/* ---- Photo de profil : recadrage carré + compression ---- */
function compressPhoto(file) {
  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      try {
        var s = Math.min(img.naturalWidth, img.naturalHeight), sx = (img.naturalWidth - s) / 2, sy = (img.naturalHeight - s) / 2;
        var cv = document.createElement('canvas'); cv.width = 320; cv.height = 320;
        var ctx = cv.getContext('2d');
        ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, 320, 320);
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, sx, sy, s, s, 0, 0, 320, 320);
        var q = 0.8, out = cv.toDataURL('image/jpeg', q);
        while (out.length > 138000 && q > 0.35) { q -= 0.1; out = cv.toDataURL('image/jpeg', q); }
        URL.revokeObjectURL(url);
        resolve(out);
      } catch (e) { URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('Image illisible : choisissez une photo JPEG ou PNG.')); };
    img.src = url;
  });
}
function uploadPhoto(pid, file) {
  if (!file) return;
  toast('Préparation de la photo…');
  compressPhoto(file).then(function (data) {
    return A('admin.setPhoto', { praticienne: pid, image: data }).then(function () {
      cacheP.photos = null; S.photosCache = Object.assign({}, S.photosCache || {}); S.photosCache[pid] = data;
      toast('Photo de ' + pratName(pid) + ' enregistrée', 'ok'); G.emit('config', S.cfg);
      if (S.tab === 'reglages') renderSettings();
    });
  }).catch(fail);
}

      document.body.appendChild(ta); ta.select(); var ok = document.execCommand('copy'); ta.remove(); return ok;

  var done = function (ok) { if (ok) toast(okMsg || 'Copié', 'ok'); else toast('Copie impossible : sélectionnez le texte et copiez-le.', 'err'); return ok; };
  try {

  G.saveConfig(function (c) { c.affichage = Object.assign({}, c.affichage, { moisJour: !!on }); }).then(function () {
    if (S.tab === 'reglages') renderSettings();
    toast(on ? 'Mois affiché à côté du jour' : 'Numéro du jour seul', 'ok');
  }, function (e) { if (el) { el.disabled = false; el.checked = !on; } fail(e); });
}
function setHeureFin(on, el) {
  if (el) el.disabled = true;
  G.saveConfig(function (c) { c.affichage = Object.assign({}, c.affichage, { heureFin: !!on }); }).then(function () {
    if (S.tab === 'reglages') renderSettings();
    toast(on ? 'Heure de fin affichée' : 'Seule l\'heure de début est affichée', 'ok');
  }, function (e) { if (el) { el.disabled = false; el.checked = !on; } fail(e); });
}
function saveConfig() {
  var btn = $('[data-act="cfg-save"]'); if (btn) { btn.disabled = true; btn.textContent = 'Enregistrement…'; }
  var draft = normCfg(S.draft);
  A('admin.sauverConfig', { config: draft }).then(function (c) {
    S.dirty = false; S.cfgErrors = null; S.draft = null;
    applyServerCfg(c); S.draft = clone(S.cfg);
    renderSettings(); toast('Réglages enregistrés', 'ok');
    loadPlanning(true, true);
  }, function (e) {
    S.cfgErrors = e.details && e.details.erreurs ? e.details.erreurs : [e.message];
    renderSettings();
    var b = $('#v-reglages .errbox'); if (b) b.scrollIntoView({ block: 'center' });
  });
}

/* ================= Événements ================= */
var ACT = {
  'tab': function (el) { closeAll(); switchTab(el.dataset.tab); },
  'add': function () { newRdv({ date: S.view === 'jour' && S.date >= today() ? S.date : undefined }); },
  'prev': function () { stepDay(-1); },
  'next': function () { stepDay(1); },
  'today': function () { goDate(today()); },
  'view': function (el) { S.view = el.dataset.v; LS.set('view', S.view); S.scrollPending = true; loadPlanning(false); },
  'mode': function (el) { var m = el.dataset.v; if (m === S.mode) return; S.mode = m; if (m === 'agenda') unmountStats(); window.scrollTo(0, 0); S.scrollPending = true; renderPlanning(); },
  'fprat': function (el) { setFiltre({ prat: el.dataset.v }); },
  'refresh': function () { S.loading = true; renderPlanning(); refreshAll().then(function () { toast('Planning à jour'); }); },
  'search': function () { openSearch(); },
  'search-close': function () { closeSearch(); },
  'filters': function (el) { openFilters(el); },
  'magie': function () { closeAll(); openMagie({}); },
  'fill-day': function (el) { closeAll(); openMagie({ jours: [el.dataset.d] }); },
  'gs-cli': function (el) { closeSearch(); openClient(el.dataset.cle); },
  'gs-rdv': function (el) { closeSearch(); openRdv(el.dataset.id); },
  'goday': function (el) { goDate(el.dataset.date, 'jour'); },
  'rdv': function (el) { openRdv(el.dataset.id); },
  'bl': function (el, ev) { ev.stopPropagation(); openSheet(blocInfoView(el.dataset.id)); },
  'freez': function (el, ev) { ev.stopPropagation(); newRdv({ praticienne: el.dataset.prat, date: S.date, debut: el.dataset.debut }); },
  'slot': function (el, ev) {
    var rect = el.getBoundingClientRect();
    var m = tlStart + (ev.clientY - rect.top) / PPM();
    m = Math.floor(m / 15) * 15;
    openSheet(addMenu({ date: S.date, prat: el.dataset.prat, heure: U.toHHMM(Math.max(0, Math.min(m, 1425))) }));
  },
  'open-exc': function (el) { openSheet(openExcView(el.dataset.date)); },
  'pin': function (el) { pinKey(el.dataset.k); },
  'q-st': function (el) { var r = findRdv(el.dataset.id); if (r) setStatut(r, el.dataset.v); },
  'legend': function () { S.legend = !S.legend; LS.set('legend', S.legend); renderPlanning(); },
  'settab': function (el) { S.setTab = el.dataset.v; LS.set('setTab', S.setTab); renderSettings(); sectionLoad(S.setTab); },
  'setback': function () { S.setTab = null; LS.set('setTab', null); renderSettings(); },
  'theme': function (el) { S.themePref = el.dataset.v; LS.set('theme', S.themePref); applyTheme(); renderSettings(); },
  'ph-del': function (el) {
    var pid = el.dataset.id;
    dialog({ title: 'Supprimer la photo ?', text: 'Le monogramme sera affiché à la place.', ok: 'Supprimer', danger: true }).then(function (ok) {
      if (!ok) return;
      A('admin.setPhoto', { praticienne: pid, image: '' }).then(function () { cacheP.photos = null; if (S.photosCache) S.photosCache[pid] = null; toast('Photo supprimée'); G.emit('config', S.cfg); renderSettings(); }, fail);
    });
  },
  'mg-svc': function (el) {
    var D = S.draft, m = svcMap(D), cat = el.dataset.cat, id = el.dataset.id;
    var list = (D.magie.services || []).filter(function (x) { return m[x] && m[x].categorie !== cat; });
    if ((D.magie.services || []).indexOf(id) < 0) list.push(id);
    list.sort(function (a, b) { return (m[a].categorie === 'pied') - (m[b].categorie === 'pied'); });
    if (!list.some(function (x) { return m[x].categorie === 'main'; }) && !list.length) { toast('Gardez au moins une prestation.', 'err'); return; }
    if (!list.length) return;
    D.magie.services = list; S.dirty = true; renderSettings();
  },
  'of-copy': function (el) { copyText(el.dataset.url, 'Lien copié'); },
  'of-close': function (el) {
    dialog({ title: 'Fermer ce lien ?', text: 'Les clientes ne pourront plus réserver avec ce lien. Les rendez-vous déjà pris sont conservés.', ok: 'Fermer le lien', danger: true }).then(function (ok) {
      if (!ok) return;
      A('admin.fermerOffre', { id: el.dataset.id }).then(function () {
        toast('Lien fermé'); loadOffresList();
      }, fail);
    });
  },
  'cfg-save': saveConfig,
  'col-mode': function (el) { S.draft.couleurs.mode = el.dataset.v; S.dirty = true; renderSettings(); },
  'col-sw': function (el) { setColor(el.dataset.col, el.dataset.v, true); },
  'col-reset': function () {
    var K = S.draft.couleurs; K.praticiennes = {}; K.prestations = {};
    var tmp = { praticiennes: S.draft.praticiennes, services: S.draft.services };
    S.draft.praticiennes.forEach(function (p) { K.praticiennes[p.id] = pColor(p.id, tmp); });
    S.draft.services.forEach(function (x) { K.prestations[x.id] = sColor(x.id, tmp); });
    S.dirty = true; renderSettings(); toast('Couleurs d\'origine remises : pensez à enregistrer');
  },
  'cfg-cancel': function () { S.draft = clone(S.cfg); S.dirty = false; S.cfgErrors = null; renderSettings(); },
  'exc-add': function () {
    var d = $('#exc-new').value; if (!d) return;
    S.draft.exceptions = S.draft.exceptions || {};
    if (S.draft.exceptions[d]) { toast('Cette date existe déjà.', 'err'); return; }
    var base = S.draft.semaine[String(U.weekday(d))];
    S.draft.exceptions[d] = base && base.ouvert ? clone(base) : { ouvert: true, debut: '09:00', fin: '20:00', dernierGel: '18:30', dernierSemi: '19:00' };
    S.dirty = true; renderSettings();
  },
  'exc-del': function (el) { delete S.draft.exceptions[el.dataset.k]; S.dirty = true; renderSettings(); },
  'bl-add': function () { openSheet(blocView({ date: U.addDays(today(), 1) })); },
  'bl-del': function (el) { delBloc(el.dataset.id, function () { loadBlocList(); }); },
  'pin-change': function () {
    var o = $('#pin-old').value, n = $('#pin-new').value, n2 = $('#pin-new2').value;
    if (!/^\d{4,8}$/.test(n)) { toast('Le nouveau code doit faire 4 à 8 chiffres.', 'err'); return; }
    if (n !== n2) { toast('Les deux nouveaux codes ne correspondent pas.', 'err'); return; }
    A('admin.changerPin', { ancien: o, nouveau: n }).then(function (res) {
      API.setToken(res.token); ['#pin-old', '#pin-new', '#pin-new2'].forEach(function (s) { $(s).value = ''; }); toast('Code PIN modifié', 'ok');
    }, fail);
  },
  'logout': function () {
    dialog({ title: 'Se déconnecter ?', text: 'Il faudra retaper le code PIN sur cet appareil.', ok: 'Se déconnecter' }).then(function (ok) {
      if (!ok) return; API.logout(); resetSession(); showLogin();
    });
  },
  'cfg-reset': function () {
    dialog({ title: 'Rétablir les réglages d\'origine ?', text: 'Horaires, durées, textes et options reviendront à leur valeur de départ.', ok: 'Rétablir', danger: true }).then(function (ok) {
      if (!ok) return;
      A('admin.reinitialiserConfig').then(function (c) { S.dirty = false; S.cfgErrors = null; applyServerCfg(c); S.draft = clone(S.cfg); renderSettings(); toast('Réglages d\'origine rétablis', 'ok'); loadPlanning(true, true); }, fail);
    });
  },
  'demo-reset': function () {
    dialog({ title: 'Réinitialiser la démo ?', text: 'Toutes les données fictives seront recréées.', ok: 'Réinitialiser', danger: true }).then(function (ok) {
      if (!ok) return; API.resetDemo(); location.reload();
    });
  }
};
function resetSession() {
  closeAll(); closeSearch(); closeFilters(); unmountStats(); unmountClientes();
  S.data = null; S.range = null; S.draft = null; S.cache = {}; S.attente = null; S.cfg = null; S.sig = null; S.mode = 'agenda';
  cacheP.historique = null; cacheP.clientes = null; cacheP.photos = null; gsClientList = null;
}

document.addEventListener('click', function (ev) {
  // Fermeture des menus flottants au clic extérieur
  if (!$('#filt-pop').hidden && !ev.target.closest('#filt-pop') && !ev.target.closest('[data-act="filters"]')) closeFilters();
  if (GS.open && !ev.target.closest('#gsearch') && !ev.target.closest('[data-act="search"]')) closeSearch();
  var ly = ev.target.closest('[data-ly]');
  if (ly) { var L = ly.closest('.layer'), lv = L && L._view; if (lv) { if (ly.dataset.ly === 'back') closeFrom(lv); else closeGroup(lv); } return; }
  var el = ev.target.closest('[data-act]');
  if (!el || el.disabled) return;
  var act = el.dataset.act, layer = el.closest('.layer'), v = layer && layer._view;
  if (v && !v.raw && v.on && v.on(act, el, ev)) return;
  if (ACT[act]) ACT[act](el, ev);
});
document.addEventListener('keydown', function (ev) {
  if (!$('#login').hidden) {
    if (/^\d$/.test(ev.key)) pinKey(ev.key);
    else if (ev.key === 'Backspace') pinKey('del');
    else if (ev.key === 'Enter') pinKey('ok');
    return;
  }
  if (ev.key === 'Escape') {
    if ($('#dialog').innerHTML) return;
    if (GS.open) { closeSearch(); return; }
    if (!$('#filt-pop').hidden) { closeFilters(); return; }
    if (topView()) closeFrom(topView());
    return;
  }
  var t = ev.target;
  if (t.id === 'gs-q') {
    var items = document.querySelectorAll('#gs-res .gs-i');
    if (ev.key === 'ArrowDown' && items.length) { GS.hl = (GS.hl + 1) % items.length; renderGS(); ev.preventDefault(); }
    else if (ev.key === 'ArrowUp' && items.length) { GS.hl = (GS.hl + items.length - 1) % items.length; renderGS(); ev.preventDefault(); }
    else if (ev.key === 'Enter' && items[GS.hl]) { ev.preventDefault(); items[GS.hl].click(); }
    return;
  }
  var tv = topView(); if (tv && tv.onKey && t.closest && t.closest('.layer') === tv.layer) { tv.onKey(ev); if (ev.defaultPrevented) return; }
  if ((ev.key === 'Enter' || ev.key === ' ') && t.matches && t.matches('[role="button"][data-act]')) { ev.preventDefault(); t.click(); }
  if (S.tab === 'planning' && S.mode === 'agenda' && !topView() && !/INPUT|TEXTAREA|SELECT/.test(t.tagName)) {
    if (ev.key === 'ArrowLeft') stepDay(-1);
    if (ev.key === 'ArrowRight') stepDay(1);
  }
});
function onField(ev) {
  var el = ev.target;
  if (el.id === 'datepick') { if (el.value && ev.type === 'change') goDate(el.value); return; }
  if (el.id === 'gs-q') { if (ev.type === 'input') gsInput(el.value); return; }
  if (el.dataset && el.dataset.pref) { if (ev.type === 'change') setPref(el.dataset.pref, el.checked); return; }
  if (el.dataset && el.dataset.hfin) { if (ev.type === 'change') setHeureFin(el.checked, el); return; }
  if (el.dataset && el.dataset.mjour) { if (ev.type === 'change') setMoisJour(el.checked, el); return; }
  var layer = el.closest('.layer'), v = layer && layer._view;
  if (v) { if (!v.raw && v.onInput) v.onInput(el, ev); return; }
  if (el.closest('#v-reglages')) {
    if (ev.type === 'input' && (el.type === 'checkbox' || el.type === 'radio' || el.type === 'file')) return;
    if (ev.type === 'change' && !(el.type === 'checkbox' || el.type === 'radio' || el.type === 'file' || el.dataset.col)) return;
    settingsInput(el, ev);
  }
}
document.addEventListener('input', onField);
document.addEventListener('change', onField);

window.addEventListener('sorelle:logout', function () {
  $('#dialog').innerHTML = '';
  resetSession();
  if ($('#login').hidden) { showLogin(); pinErr = 'Session expirée, reconnectez-vous.'; renderLogin(); }
});

/* Rafraîchissement auto (60 s et au retour sur l'app) */
function autoRefresh() {
  if (!API.isLoggedIn() || $('#app').hidden || document.visibilityState !== 'visible') return;
  refreshAll();
}
setInterval(autoRefresh, 60000);
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') autoRefresh(); });
var lastW = window.innerWidth;
window.addEventListener('resize', function () {
  var w = window.innerWidth;
  if ((w < 700) !== (lastW < 700) || (w < 1280) !== (lastW < 1280) || Math.abs(w - lastW) > 80) {
    lastW = w; closeFilters();
    if (S.tab === 'planning' && S.mode === 'agenda') renderPlanning();
    if (S.tab === 'reglages') renderSettings();
  }
});

/* Tirer pour actualiser (planning) */
(function () {
  var y0 = null, dy = 0, ptr = $('#ptr');
  ptr.innerHTML = I.refresh + '<span>Relâcher pour actualiser</span>';
  window.addEventListener('touchstart', function (e) {
    y0 = (S.tab === 'planning' && !topView() && window.scrollY <= 0 && !$('#app').hidden) ? e.touches[0].clientY : null; dy = 0;
  }, { passive: true });
  window.addEventListener('touchmove', function (e) {
    if (y0 == null) return; dy = e.touches[0].clientY - y0;
    if (dy > 10) ptr.style.transform = 'translate(-50%,' + Math.min(dy - 80, 10) + 'px)';
  }, { passive: true });
  window.addEventListener('touchend', function () {
    if (y0 != null && dy > 80) { ptr.querySelector('svg').classList.add('spin'); refreshAll().then(function () { ptr.style.transform = ''; ptr.querySelector('svg').classList.remove('spin'); }); }
    else ptr.style.transform = '';
    y0 = null;
  });
})();

G.on('login', primeClients);
G.on('change', function () { if (GS.open) primeClients(); });

/* Démarrage : après le chargement des modules (fin de body) */
if (API.isDemo) { $('#demo-strip').hidden = false; document.body.classList.add('has-demo'); }
function boot() { if (API.isLoggedIn()) startApp(); else showLogin(); }
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else setTimeout(boot, 0);
})();
</script>
