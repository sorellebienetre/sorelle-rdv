<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sorelle Planning">
<meta name="theme-color" content="#FBF7EE">
<meta name="format-detection" content="telephone=no">
<title>Sorelle · Planning</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2216%22 fill=%22%235A6B4D%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=Outfit:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --sage:#8A9D7A; --sage-d:#6F8161; --sage-700:#5A6B4D; --sage-900:#3A4A2F; --sage-300:#B5C2A5; --sage-100:#DDE5D0; --sage-50:#ECF0E0;
  --ink:#1E2218; --ink-2:#2A2F23; --char:#3C4233; --text:#2A2F23; --text-sub:#5A6453; --text-mute:#8E9583;
  --cream:#F5EFE3; --cream-2:#ECE3D0; --bone:#E7DCC5; --paper:#FBF7EE; --paper-2:#F7F1E1;
  --clay:#C97B5A; --clay-d:#A85F3F; --clay-light:#E0A48A; --clay-50:#F7E6DC;
  --danger:#A8432F;
  --line:rgba(30,34,24,.10); --line-2:rgba(30,34,24,.05); --line-3:rgba(30,34,24,.18);
  --serif:'Fraunces',Georgia,serif; --sans:'Outfit',-apple-system,BlinkMacSystemFont,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
  --nav-w:0px; --tab-h:0px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --radius:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow-x:hidden;touch-action:manipulation}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent}
input,select,textarea{font-size:16px}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;color:var(--ink);letter-spacing:-.01em}
h1 em,h2 em,h3 em{font-style:italic;color:var(--clay)}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-mute);font-weight:500}
.mono{font-family:var(--mono)}
svg{display:block}
:focus-visible{outline:2px solid var(--clay);outline-offset:2px}

/* ---------- Boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;font-size:15px;font-weight:500;line-height:1;white-space:nowrap;border:1px solid transparent;transition:background .2s,color .2s,border-color .2s}
.btn:active{transform:scale(.98)}
.btn svg{width:16px;height:16px}
.btn-ink{background:var(--ink);color:var(--paper)}
.btn-ink:hover{background:var(--char)}
.btn-clay{background:var(--clay);color:var(--paper)}
.btn-clay:hover{background:var(--clay-d)}
.btn-sage{background:var(--sage-700);color:var(--paper)}
.btn-sage:hover{background:var(--sage-900)}
.btn-ghost{border-color:var(--line-3);background:var(--paper);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink)}
.btn-danger{border-color:rgba(168,67,47,.35);color:var(--danger);background:var(--paper)}
.btn-danger:hover{background:var(--danger);color:var(--paper)}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-sm{min-height:36px;padding:0 14px;font-size:14px}
.icon-btn{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;color:var(--ink);flex:none}
.icon-btn:hover{background:var(--line-2)}
.icon-btn svg{width:20px;height:20px}
.link-btn{color:var(--clay-d);font-weight:500;text-decoration:underline;text-underline-offset:3px;min-height:44px;padding:0 4px}
.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Segmenté ---------- */
.seg{display:inline-flex;background:var(--cream-2);border-radius:999px;padding:3px;gap:2px;max-width:100%}
.seg button{min-height:38px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:500;color:var(--text-sub);white-space:nowrap;flex:1}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(30,34,24,.12)}
.seg.full{display:flex;width:100%}

/* ---------- Bandeau démo ---------- */
#demo-strip{background:var(--ink);color:var(--cream);font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;text-align:center;padding:calc(3px + var(--safe-t)) 12px 3px;margin-left:var(--nav-w);position:relative;z-index:41}
body.has-demo .topbar,body.has-demo .page{padding-top:10px}
body.has-demo #login{min-height:calc(100dvh - 20px)}

/* ---------- Connexion ---------- */
#login{min-height:100dvh;display:grid;place-items:center;padding:32px 16px calc(32px + var(--safe-b));background:var(--paper)}
.login-box{width:100%;max-width:340px;text-align:center}
.login-box h1{font-size:38px;line-height:1.05;margin:10px 0 6px}
.login-box p.sub{color:var(--text-sub);margin:0 0 26px}
.pin-dots{display:flex;justify-content:center;gap:14px;height:22px;align-items:center;margin-bottom:10px}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink);display:block}
.pin-dots i.on{background:var(--ink)}
.pin-err{min-height:22px;color:var(--danger);font-size:14px;margin-bottom:12px}
.pin-pad{display:grid;grid-template-columns:repeat(3,76px);gap:16px 22px;justify-content:center}
.pin-pad button{width:76px;height:76px;border-radius:50%;background:var(--cream);font-size:28px;font-family:var(--sans);font-weight:400;color:var(--ink);display:grid;place-items:center}
.pin-pad button:active{background:var(--bone)}
.pin-pad button.ghost{background:transparent;font-size:15px;color:var(--text-sub)}
.pin-pad button svg{width:24px;height:24px}
.login-box .btn{margin-top:26px;width:100%}
.demo-hint{margin-top:18px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--clay-d)}
.shake{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* ---------- Navigation ---------- */
#nav{position:fixed;z-index:40;background:var(--paper);display:flex}
.nav-brand{display:none}
.nav-tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text-mute);font-size:11px;font-weight:500;min-height:44px;flex:1}
.nav-tab svg{width:22px;height:22px}
.nav-tab.on{color:var(--ink)}
.nav-tab.on svg{color:var(--clay)}
.nav-badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--clay);color:var(--paper);font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 5px}
.nav-add{display:none}
#fab{position:fixed;z-index:41;right:16px;bottom:calc(var(--tab-h) + 16px);width:58px;height:58px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;box-shadow:0 8px 24px rgba(30,34,24,.25)}
#fab svg{width:26px;height:26px}
#fab:active{transform:scale(.95)}
@media (max-width:999px){
  :root{--tab-h:calc(62px + var(--safe-b))}
  #nav{left:0;right:0;bottom:0;height:var(--tab-h);padding-bottom:var(--safe-b);border-top:1px solid var(--line)}
}
@media (min-width:1000px){
  :root{--nav-w:92px}
  #nav{top:0;bottom:0;left:0;width:var(--nav-w);flex-direction:column;align-items:stretch;border-right:1px solid var(--line);padding:16px 8px;gap:6px}
  .nav-brand{display:block;text-align:center;font-family:var(--serif);font-size:22px;color:var(--ink);margin:4px 0 18px;line-height:1}
  .nav-brand em{color:var(--clay);font-style:italic}
  .nav-tab{flex:none;min-height:66px;border-radius:14px;font-size:11.5px}
  .nav-tab.on{background:var(--cream)}
  .nav-badge{left:calc(50% + 4px);top:8px}
  .nav-add{display:grid;place-items:center;margin-top:auto;width:58px;height:58px;border-radius:50%;background:var(--ink);color:var(--paper);align-self:center}
  .nav-add svg{width:24px;height:24px}
  #fab{display:none}
}
#main{margin-left:var(--nav-w);padding-bottom:calc(var(--tab-h) + 24px);min-height:100dvh}

/* ---------- Planning : en-tête ---------- */
.plan-head{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:calc(10px + var(--safe-t)) 16px 10px}
.tb-date{position:relative;flex:1 1 auto;min-width:0;display:flex;flex-direction:column;align-items:flex-start;padding:2px 0}
.tb-date h1{font-size:25px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;display:flex;align-items:center;gap:6px}
.tb-date h1 svg{width:16px;height:16px;color:var(--text-mute);flex:none}
.tb-date input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;-webkit-appearance:none;appearance:none;border:0}
.tb-date input::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.tb-nav{display:flex;align-items:center;gap:2px}
.tb-tools{display:flex;align-items:center;gap:6px}
.badge-wait{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;background:var(--clay-50);color:var(--clay-d);font-size:13.5px;font-weight:600;white-space:nowrap}
.badge-wait b{background:var(--clay);color:var(--paper);border-radius:999px;min-width:20px;height:20px;display:inline-grid;place-items:center;font-size:12px;padding:0 6px}
.tb-add{display:none}
.subbar{display:flex;align-items:center;gap:10px;padding:0 16px 10px}
.subbar .seg{flex:1}
.chk-chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--line-3);font-size:13px;color:var(--text-sub);white-space:nowrap;background:var(--paper)}
.chk-chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chk-chip svg{width:14px;height:14px}
@media (max-width:699px){
  .topbar{position:relative;gap:6px 6px}
  .tb-date{flex-basis:100%;order:0;padding-right:96px}
  .tb-date h1{font-size:23px}
  .tb-nav{order:1;margin-left:-10px}
  .tb-nav .btn-sm{padding:0 10px}
  .tb-view{order:2;margin-left:auto}
  .tb-view button{padding:0 11px}
  .tb-tools{position:absolute;right:8px;top:8px}
  body:not(.has-demo) .tb-tools{top:calc(8px + var(--safe-t))}
  .badge-wait{padding:0 8px;font-size:0;gap:0}
  .badge-wait b{font-size:12px}
  .chk-chip .lbl{display:none}
  .chk-chip{padding:0 11px}
}
@media (min-width:1000px){
  .tb-add{display:inline-flex}
  .topbar{padding:14px 24px;gap:12px 16px}
  .tb-date h1{font-size:28px}
  .subbar{padding:0 24px 10px}
}

/* Colonnes */
.col-heads{display:grid;padding:0 16px 0 0;border-top:1px solid var(--line-2)}
.col-head{padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0;border-left:1px solid var(--line-2)}
.col-head .nm{font-family:var(--serif);font-size:19px;color:var(--ink);display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.col-head .cnt{font-family:var(--mono);font-size:12px;color:var(--text-sub)}
.col-head .cnt.full{color:var(--clay-d)}
.col-head .free{font-size:12.5px;color:var(--sage-700);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col-head .free.none{color:var(--text-mute)}
.col-head.narrow .nm{font-size:16px}
@media (min-width:1000px){.col-heads{padding-right:24px}}

/* ---------- Timeline ---------- */
.plan-body{padding:0 16px 0 0;position:relative}
@media (min-width:1000px){.plan-body{padding-right:24px}}
.tl{position:relative;display:grid;margin-top:10px}
.tl-gutter{position:relative}
.tl-gutter .hl{position:absolute;right:8px;transform:translateY(-50%);font-family:var(--mono);font-size:11px;color:var(--text-mute)}
.tl-gutter .hl:first-child{transform:none}
.tl-cols{position:relative;display:grid;background:var(--paper);border-radius:12px;box-shadow:0 0 0 1px var(--line)}
.tl-grid{position:absolute;inset:0;pointer-events:none;border-radius:12px}
.tl-col{position:relative;border-left:1px solid var(--line);cursor:copy}
.tl-col:first-of-type{border-left:0}
.tl-col.inactive{background:repeating-linear-gradient(135deg,var(--cream-2) 0 6px,var(--cream) 6px 12px)}
.off{position:absolute;left:0;right:0;background:var(--cream-2);opacity:.75;pointer-events:none}
.lunch{position:absolute;left:0;right:0;background:linear-gradient(90deg,rgba(181,194,165,.20),rgba(181,194,165,.08));border-top:1px dashed var(--sage-300);border-bottom:1px dashed var(--sage-300);pointer-events:none}
.lunch span{position:absolute;right:6px;top:3px;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--sage-700);opacity:.8}
.lastline{position:absolute;left:0;right:0;border-top:1px dashed var(--clay-light);pointer-events:none}
.lastline span{position:absolute;right:6px;top:1px;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--clay-d);background:var(--paper);padding:0 4px;border-radius:4px}
.blk{position:absolute;left:3px;right:3px;border-radius:8px;background:repeating-linear-gradient(135deg,rgba(60,66,51,.10) 0 7px,rgba(60,66,51,.03) 7px 14px);border:1px solid rgba(60,66,51,.16);color:var(--char);font-size:12.5px;padding:6px 8px;overflow:hidden;cursor:pointer;z-index:1}
.blk span{display:inline-flex;align-items:center;gap:5px;background:var(--paper);padding:2px 8px;border-radius:999px;font-weight:500}
.blk svg{width:12px;height:12px}
.buffer{position:absolute;pointer-events:none;background:repeating-linear-gradient(135deg,rgba(138,157,122,.22) 0 4px,transparent 4px 8px);border-radius:0 0 6px 6px;z-index:1}
.card{position:absolute;border-radius:9px;padding:5px 8px;overflow:hidden;cursor:pointer;z-index:2;font-size:12.5px;line-height:1.25;display:flex;flex-direction:column;gap:1px;text-align:left;border:1px solid transparent}
.card .c-time{font-family:var(--mono);font-size:11px;color:var(--text-sub);position:relative;z-index:1;white-space:nowrap}
.card .c-name{font-weight:600;color:var(--ink);font-size:13.5px;position:relative;z-index:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .c-svc{color:var(--text-sub);position:relative;z-index:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .c-tags{display:flex;gap:4px;flex-wrap:wrap;position:relative;z-index:1;margin-top:2px}
.tag{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:999px;white-space:nowrap;font-weight:500}
.tag-wait{background:var(--clay);color:var(--paper)}
.tag-new{background:var(--paper);color:var(--sage-900);border:1px solid var(--sage-300)}
.tag-cab{background:var(--sage-700);color:var(--paper)}
.card.st-confirme{background:var(--sage-100);border-color:var(--sage-300);box-shadow:inset 3px 0 0 var(--sage-d)}
.card.st-en_attente{background:var(--paper);border:1.5px dashed var(--clay);box-shadow:inset 3px 0 0 var(--clay)}
.card.st-annule,.card.st-refuse,.card.st-absente{background:var(--paper);border:1px dotted var(--text-mute);opacity:.62;z-index:1}
.card.st-annule .c-name,.card.st-refuse .c-name,.card.st-absente .c-name{text-decoration:line-through}
.card.tiny{flex-direction:row;align-items:center;gap:6px;padding:2px 8px}
.card.tiny .c-svc,.card.tiny .c-tags{display:none}
.card:hover{filter:brightness(.98)}
.seg-cab{position:absolute;left:0;right:0;background:linear-gradient(90deg,rgba(138,157,122,.55),rgba(138,157,122,.28));border-top:1px solid var(--sage);z-index:0;display:flex;align-items:flex-end;justify-content:flex-end;padding:3px 6px}
.seg-cab span{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--sage-900);background:rgba(251,247,238,.85);padding:1px 6px;border-radius:999px;white-space:nowrap}
.seg-cab svg{width:12px;height:12px}
.massage-layer{position:absolute;inset:0;pointer-events:none;z-index:1}
.mcard{position:absolute;left:4px;right:4px;pointer-events:auto;border-radius:10px;background:repeating-linear-gradient(135deg,var(--clay-50) 0 10px,#F3DCCD 10px 20px);border:1.5px solid var(--clay);padding:6px 10px;cursor:pointer;display:flex;flex-direction:column;gap:2px;overflow:hidden;font-size:12.5px}
.mcard .m-title{font-weight:600;color:var(--clay-d);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard .m-title svg{width:14px;height:14px;flex:none}
.mcard .m-sub{color:var(--char);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard.st-en_attente{border-style:dashed}
.mcard.st-annule,.mcard.st-refuse,.mcard.st-absente{opacity:.5;background:var(--paper);border-style:dotted}
.mbuffer{position:absolute;left:4px;right:4px;background:repeating-linear-gradient(135deg,rgba(201,123,90,.2) 0 4px,transparent 4px 8px);pointer-events:none}
.now{position:absolute;left:-6px;right:0;height:0;border-top:2px solid var(--clay);z-index:5;pointer-events:none}
.now::before{content:'';position:absolute;left:-4px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--clay)}
.now span{position:absolute;left:-56px;top:-9px;font-family:var(--mono);font-size:11px;color:var(--paper);background:var(--clay);border-radius:6px;padding:1px 5px}
.closed-banner{margin:10px 0 0 52px;padding:10px 14px;border-radius:12px;background:var(--clay-50);color:var(--clay-d);font-size:14px}

/* Vide / fermé */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:64px 24px;gap:10px;color:var(--text-sub)}
.empty h2{font-size:34px}
.empty .ill{width:64px;height:64px;border-radius:50%;background:var(--paper);display:grid;place-items:center;color:var(--sage-d);box-shadow:0 0 0 1px var(--line)}
.empty .ill svg{width:28px;height:28px}
.empty p{max-width:360px;margin:0 0 8px}
.loading{display:flex;justify-content:center;align-items:center;gap:10px;padding:60px 20px;color:var(--text-mute)}
.loading svg{width:20px;height:20px}

/* ---------- Vue semaine ---------- */
.week{display:flex;flex-direction:column;gap:10px;padding:14px 0 0 16px}
.wk-day{display:grid;grid-template-columns:84px 1fr;gap:12px;background:var(--paper);border-radius:var(--radius);padding:12px;text-align:left;box-shadow:0 0 0 1px var(--line);width:100%}
.wk-day:hover{box-shadow:0 0 0 1px var(--line-3)}
.wk-day.closed{background:transparent;box-shadow:0 0 0 1px var(--line-2);opacity:.6}
.wk-day.is-today{box-shadow:0 0 0 2px var(--clay)}
.wk-date .d1{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-mute)}
.wk-date .d2{font-family:var(--serif);font-size:30px;line-height:1;color:var(--ink)}
.wk-date .d3{font-size:12px;color:var(--text-sub);margin-top:4px}
.wk-cols{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:10px;min-width:0}
.wk-col{min-width:0}
.wk-col h4{margin:0 0 4px;font-size:12.5px;font-weight:600;color:var(--text-sub);display:flex;justify-content:space-between;gap:6px}
.wk-col h4 span{font-family:var(--mono);font-weight:400}
.wk-item{display:flex;gap:6px;font-size:13px;padding:3px 6px;border-radius:6px;background:var(--sage-50);margin-bottom:3px;white-space:nowrap;overflow:hidden;min-width:0}
.wk-item b{font-family:var(--mono);font-weight:400;font-size:11.5px;color:var(--text-sub);flex:none;padding-top:1px}
.wk-item span{overflow:hidden;text-overflow:ellipsis}
.wk-item.wait{background:var(--paper);outline:1.5px dashed var(--clay);outline-offset:-1.5px}
.wk-item.bloc{background:repeating-linear-gradient(135deg,rgba(60,66,51,.08) 0 6px,transparent 6px 12px);color:var(--char)}
.wk-item.mass{background:var(--clay-50);color:var(--clay-d)}
.wk-item.cancel{opacity:.55;text-decoration:line-through;background:transparent}
.wk-none{font-size:12.5px;color:var(--text-mute)}
.wk-closed{font-family:var(--serif);font-style:italic;color:var(--text-mute);font-size:16px;align-self:center}
@media (min-width:1000px){.week{padding-left:24px}}
@media (min-width:1280px){
  .week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
  .wk-day{grid-template-columns:1fr;align-content:start;min-height:320px}
  .wk-cols{grid-template-columns:1fr}
}

/* ---------- Pages (listes, réglages) ---------- */
.page{max-width:860px;margin:0 auto;padding:calc(18px + var(--safe-t)) 16px 24px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 18px}
.page-head h1{font-size:32px;line-height:1.05}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--paper);border-radius:var(--radius);box-shadow:0 0 0 1px var(--line);padding:14px;display:flex;flex-direction:column;gap:8px}
.item-main{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%}
.item-date{flex:none;width:56px;text-align:center;border-right:1px solid var(--line);padding-right:10px}
.item-date .d1{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-mute)}
.item-date .d2{font-family:var(--serif);font-size:26px;line-height:1;color:var(--ink)}
.item-date .d3{font-size:11.5px;color:var(--text-sub)}
.item-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.item-body .nm{font-weight:600;font-size:16px;color:var(--ink);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item-body .meta{color:var(--text-sub);font-size:14px}
.item-actions{display:flex;gap:8px;justify-content:flex-end}
.item-actions .btn{flex:1;max-width:200px}
.pill{display:inline-flex;align-items:center;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:999px;font-weight:500;white-space:nowrap}
.pill.confirme{background:var(--sage-100);color:var(--sage-900)}
.pill.en_attente{background:var(--clay);color:var(--paper)}
.pill.annule,.pill.refuse,.pill.absente{background:var(--cream-2);color:var(--text-sub)}
.search-box{position:relative;margin-bottom:16px}
.search-box input{width:100%;min-height:52px;border-radius:999px;border:1px solid var(--line-3);background:var(--paper);padding:0 18px 0 48px;-webkit-appearance:none;appearance:none}
.search-box svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--text-mute)}
.hint{color:var(--text-mute);font-size:13.5px}
.group-title{margin:18px 0 8px}

/* ---------- Formulaires ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.field>label,.flabel{font-size:13.5px;font-weight:500;color:var(--text-sub)}
.field .help{font-size:12.5px;color:var(--text-mute);margin-top:-2px}
.inp,input.inp,select.inp,textarea.inp{width:100%;min-height:46px;border:1px solid var(--line-3);border-radius:12px;background:var(--paper);padding:10px 12px;font-size:16px;color:var(--ink);-webkit-appearance:none;appearance:none;min-width:0}
textarea.inp{min-height:84px;resize:vertical;line-height:1.4}
.inp:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(30,34,24,.07)}
input[type=time].inp,input[type=date].inp{display:block;line-height:24px}
input[type=date].inp::-webkit-date-and-time-value,input[type=time].inp::-webkit-date-and-time-value{text-align:left}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.row4{grid-template-columns:1fr 1fr}}
.step{margin-bottom:20px}
.step-t{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.step-t .n{width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:12px;font-family:var(--mono);flex:none}
.step-t h3{font-size:19px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.opt{min-height:52px;border-radius:12px;border:1px solid var(--line-3);background:var(--paper);padding:8px 12px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14.5px;color:var(--ink)}
.opt small{font-family:var(--mono);font-size:11.5px;color:var(--text-mute);white-space:nowrap}
.opt.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.opt.on small{color:var(--sage-300)}
.opt-g{margin:12px 0 6px;display:flex;align-items:center;gap:8px}
.opt-g svg{width:15px;height:15px;color:var(--sage-d)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line-3);background:var(--paper);display:inline-flex;align-items:center;gap:8px;font-size:14.5px;color:var(--ink)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.slot{min-height:50px;padding:6px 14px;border-radius:12px;border:1px solid var(--line-3);background:var(--paper);display:inline-flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;min-width:96px}
.slot b{font-size:16px;font-weight:600;color:var(--ink)}
.slot small{font-size:11.5px;color:var(--text-mute);font-family:var(--mono)}
.slot.A{border-color:var(--sage);background:var(--sage-50)}
.slot .ideal{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--sage-900)}
.slot.C small{color:var(--clay-d)}
.slot.on{background:var(--ink);border-color:var(--ink)}
.slot.on b,.slot.on small,.slot.on .ideal{color:var(--paper)}
.free-row{display:flex;gap:10px;align-items:center;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--cream);flex-wrap:wrap}
.free-row .flabel{flex:1 1 auto}
.free-row input{width:150px;flex:none}
.free-row.on{box-shadow:0 0 0 2px var(--ink)}
.notice{padding:12px 14px;border-radius:12px;background:var(--cream);color:var(--char);font-size:14px;display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}
.notice svg{width:18px;height:18px;flex:none;margin-top:1px}
.notice.clay{background:var(--clay-50);color:var(--clay-d)}
.notice.sage{background:var(--sage-50);color:var(--sage-900)}
.errbox{padding:12px 14px;border-radius:12px;background:#F6E0D9;color:#7E2E1E;font-size:14px;margin:0 0 14px}
.errbox ul{margin:6px 0 0;padding-left:18px}
.errbox .btn{margin-top:10px}
.switch{position:relative;display:inline-flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;font-size:15px;color:var(--ink)}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch i{width:46px;height:28px;border-radius:999px;background:var(--bone);position:relative;flex:none;transition:background .2s}
.switch i::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s var(--ease)}
.switch input:checked+i{background:var(--sage-700)}
.switch input:checked+i::after{transform:translateX(18px)}
.switch input:focus-visible+i{outline:2px solid var(--clay);outline-offset:2px}
.radio-card{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;border:1px solid var(--line-3);background:var(--paper);cursor:pointer;margin-bottom:8px}
.radio-card input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--ink);flex:none}
.radio-card b{display:block;font-weight:600;color:var(--ink)}
.radio-card span{font-size:13.5px;color:var(--text-sub)}
.radio-card.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}

/* ---------- Bottom sheet / panneau ---------- */
#sheet{position:fixed;inset:0;z-index:60;pointer-events:none}
#sheet.open{pointer-events:auto}
.sh-backdrop{position:absolute;inset:0;background:rgba(30,34,24,.38)}
.sh-panel{position:absolute;left:0;right:0;bottom:0;max-height:calc(100dvh - 40px - var(--safe-t));background:var(--paper);border-radius:22px 22px 0 0;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(30,34,24,.18);animation:up .22s var(--ease)}
@keyframes up{from{transform:translateY(40px);opacity:.6}}
@media (min-width:700px) and (max-width:1099px){.sh-panel{left:50%;right:auto;width:min(680px,100% - 32px);transform:translateX(-50%);animation:none}}
@media (min-width:1100px){
  .sh-backdrop{background:rgba(30,34,24,.18)}
  .sh-panel{left:auto;top:0;right:0;width:480px;max-height:none;border-radius:0;animation:side .2s var(--ease);box-shadow:-10px 0 40px rgba(30,34,24,.14)}
  @keyframes side{from{transform:translateX(30px);opacity:.6}}
}
.sh-head{display:flex;align-items:center;gap:6px;padding:8px 8px 6px 16px;border-bottom:1px solid var(--line-2);position:relative}
.sh-head h2{flex:1;font-size:21px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-head .icon-btn:first-child{margin-left:-8px}
.sh-grip{position:absolute;top:6px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--line-3)}
@media (min-width:1100px){.sh-grip{display:none}}
.sh-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;flex:1;overscroll-behavior:contain}
.sh-foot{padding:12px 16px calc(12px + var(--safe-b));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;background:var(--paper)}
.sh-foot .sum{font-size:13px;color:var(--text-sub);text-align:center}
.foot-row{display:flex;gap:10px}
.foot-row .btn{flex:1}

/* Détail */
.d-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
.d-head h3{font-size:28px;line-height:1.1}
.d-when{font-size:16px;color:var(--ink);margin-top:6px}
.d-when .mono{font-size:14px;color:var(--text-sub)}
.dl{display:grid;grid-template-columns:120px 1fr;gap:10px 12px;margin:0 0 16px;font-size:14.5px;padding:14px;background:var(--cream);border-radius:12px}
.dl dt{color:var(--text-mute);font-size:13px}
.dl dd{margin:0;color:var(--ink);min-width:0}
.segs{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.segline{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--sage-50);font-size:14.5px}
.segline.cab{background:var(--sage-100);box-shadow:inset 3px 0 0 var(--sage-d)}
.segline.mass{background:var(--clay-50);box-shadow:inset 3px 0 0 var(--clay)}
.segline svg{width:20px;height:20px;color:var(--sage-700);flex:none}
.segline.mass svg{color:var(--clay-d)}
.segline .t{font-family:var(--mono);font-size:12.5px;color:var(--text-sub);margin-left:auto;white-space:nowrap}
.segline .w small{display:block;font-size:12px;color:var(--text-sub)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 14px}
.acts .wide{grid-column:1/-1}
.danger-zone{border-top:1px solid var(--line);padding-top:12px;text-align:center}

/* Menu ajouter */
.add-choice{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:16px;border-radius:16px;background:var(--cream);margin-bottom:10px;min-height:76px}
.add-choice:hover{background:var(--cream-2)}
.add-choice .ic{width:48px;height:48px;border-radius:50%;background:var(--paper);display:grid;place-items:center;flex:none;color:var(--sage-700)}
.add-choice .ic svg{width:22px;height:22px}
.add-choice b{display:block;font-size:17px;color:var(--ink);font-weight:600}
.add-choice span{font-size:13.5px;color:var(--text-sub)}
.add-choice.clay .ic{color:var(--clay-d)}
.add-choice.ink .ic{color:var(--char)}

/* Réglages */
.subtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 18px;padding:2px 16px;-webkit-overflow-scrolling:touch}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line-3);font-size:14px;color:var(--text-sub);background:var(--paper);white-space:nowrap}
.subtabs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.card-s{background:var(--paper);border-radius:var(--radius);box-shadow:0 0 0 1px var(--line);padding:14px 16px;margin-bottom:12px}
.card-s h3{font-size:20px;margin-bottom:4px}
.card-s .lead{color:var(--text-sub);font-size:14px;margin:0 0 12px}
.dayrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dayrow h4{margin:0;font-family:var(--serif);font-weight:400;font-size:19px;color:var(--ink)}
.dayrow+.row4{margin-top:10px}
.savebar{position:sticky;bottom:calc(var(--tab-h) + 10px);z-index:15;margin-top:14px;background:var(--ink);color:var(--paper);border-radius:18px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(30,34,24,.25)}
.savebar span{flex:1;font-size:14px}
.savebar .btn-ghost{background:transparent;color:var(--paper);border-color:rgba(251,247,238,.3)}
.savebar .btn-clay{min-width:130px}
.bl-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line-2)}
.bl-item:first-child{border-top:0}
.bl-item .bi{flex:1;min-width:0}
.bl-item b{display:block;color:var(--ink);font-weight:600}
.bl-item span{font-size:13.5px;color:var(--text-sub)}

/* Dialog / toasts */
#dialog{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:rgba(30,34,24,.45)}
#dialog:empty{display:none}
.dlg{background:var(--paper);border-radius:20px;padding:22px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.dlg h3{font-size:23px;margin-bottom:8px}
.dlg p{color:var(--text-sub);margin:0 0 18px;white-space:pre-line}
.dlg .foot-row{flex-direction:row-reverse}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + 86px);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(440px,calc(100% - 32px));pointer-events:none}
@media (min-width:1000px){#toasts{bottom:24px;left:calc(50% + var(--nav-w)/2)}}
.toast{pointer-events:auto;background:var(--ink);color:var(--paper);border-radius:14px;padding:12px 14px 12px 16px;font-size:14.5px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(30,34,24,.25);width:100%;animation:up .2s var(--ease)}
.toast span{flex:1}
.toast.err{background:#7E2E1E}
.toast button{color:var(--clay-light);font-weight:600;min-height:36px;padding:0 6px}
#ptr{position:fixed;top:calc(var(--safe-t) + 8px);left:calc(50% + var(--nav-w)/2);transform:translate(-50%,-80px);z-index:30;background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:999px;font-size:13px;display:flex;gap:8px;align-items:center;transition:transform .15s}
#ptr svg{width:16px;height:16px}
</style>
</head>
<body>
<div id="demo-strip" hidden>Mode démo · données fictives</div>
<div id="ptr" aria-hidden="true"></div>

<div id="login" hidden></div>

<div id="app" hidden>
  <nav id="nav" aria-label="Navigation principale"></nav>
  <main id="main">
    <section id="v-planning"></section>
    <section id="v-attente" hidden></section>
    <section id="v-recherche" hidden></section>
    <section id="v-reglages" hidden></section>
  </main>
  <button id="fab" data-act="add" aria-label="Ajouter"></button>
</div>

<div id="sheet"></div>
<div id="dialog"></div>
<div id="toasts" role="status" aria-live="polite"></div>

<script src="../app/config.js"></script>
<script src="../app/core.js"></script>
<script src="../app/api.js"></script>
<script>

  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>',

function hfr2(t) { if (!t) return ''; var p = t.split(':'); return (+p[0]) + 'h' + p[1]; }

    var cnt = S.data.rdvs.filter(function (r) { return r.date === d && r.praticienne === p.id && r.type !== 'massage' && ACTIVE[r.statut]; }).length;
    var max = S.cfg.maxClientesJour;
    var free = firstFree(d, p.id), freeTxt;
    if (p.active === false) freeTxt = '<span class="free none">Inactive</span>';
    else if (free === null) freeTxt = '<span class="free none">—</span>';
    else if (free === '') freeTxt = '<span class="free none">' + (cnt >= max ? 'Complet' : 'Plus de créneau') + '</span>';
    else freeTxt = '<span class="free">Libre dès ' + hfr2(free) + '</span>';
    return '<div class="col-head' + (nar ? ' narrow' : '') + '"><div class="nm">' + esc(p.nom) + '<span class="cnt' + (cnt >= max ? ' full' : '') + '" title="Clientes / maximum">' + cnt + ' / ' + max + '</span></div>' + freeTxt + '</div>';
  }).join('') + '</div>';
}
/** Premier créneau libre (prestation la plus courte), à partir de maintenant si aujourd'hui. */
function firstFree(d, prat) {
  if (d < today() || !U.dayRules(S.cfg, d)) return null;
  var short = S.cfg.services.filter(function (s) { return s.categorie === 'main'; }).sort(function (a, b) { return a.duree - b.duree; })[0];
  if (!short) return null;
  try {
    var day = U.buildDay(S.cfg, d, S.data.rdvs, S.data.blocages);
    var slots = U.computeSlots(S.cfg, day, prat, [short], 'all');
    var from = d === today() ? nowMin() : 0;
    var s = slots.filter(function (x) { return U.toMin(x.debut) >= from; })[0];
    return s ? s.debut : '';
  } catch (e) { return null; }
}

var tlStart = 480;
function layoutLanes(items) {
  items.sort(function (a, b) { return a.s - b.s || b.e - a.e; });
  var clusters = [], cur = null, end = -1;
  items.forEach(function (it) {
    if (!cur || it.s >= end) { cur = []; clusters.push(cur); end = it.e; } else end = Math.max(end, it.e);
    cur.push(it);
  });
  clusters.forEach(function (cl) {
    var lanes = [];
    cl.forEach(function (it) {
      var i = -1;
      for (var k = 0; k < lanes.length; k++) if (lanes[k] <= it.s) { i = k; break; }
      if (i < 0) { i = lanes.length; lanes.push(it.e); } else lanes[i] = it.e;
      it.lane = i;
    });
    cl.forEach(function (it) { it.lanes = lanes.length; });
  });
}

function renderTimeline(d, cols) {
  var C = S.cfg, ppm = PPM(), b = C.battement;
  var rules = U.dayRules(C, d);
  var t0 = 480, t1 = 21 * 60;
  if (rules) { t0 = Math.min(t0, Math.floor(rules.debut / 60) * 60); t1 = Math.max(t1, Math.ceil(rules.fin / 60) * 60); }
  tlStart = t0;
  var H = (t1 - t0) * ppm;
  function y(m) { return (m - t0) * ppm; }
  var rdvs = S.data.rdvs.filter(function (r) { return r.date === d && (S.showCancelled || ACTIVE[r.statut]); });
  var bls = S.data.blocages.filter(function (x) { return x.du <= d && x.au >= d; });

  var gutter = '';
  for (var h = Math.ceil(t0 / 60); h <= Math.floor(t1 / 60); h++) gutter += '<span class="hl" style="top:' + y(h * 60) + 'px">' + h + 'h</span>';

  var colsHtml = cols.map(function (p, ci) {
    var html = '';
    if (rules) {
      if (rules.debut > t0) html += '<div class="off" style="top:0;height:' + y(rules.debut) + 'px"></div>';
      if (rules.fin < t1) html += '<div class="off" style="top:' + y(rules.fin) + 'px;bottom:0"></div>';
      if (C.dejeuner && C.dejeuner.actif) {
        var ls = U.toMin(C.dejeuner.debut), le = U.toMin(C.dejeuner.fin);
        html += '<div class="lunch" style="top:' + y(ls) + 'px;height:' + (le - ls) * ppm + 'px">' + (ci === cols.length - 1 ? '<span>Fenêtre déj. ' + C.dejeuner.duree + ' min</span>' : '') + '</div>';
      }
      if (ci === cols.length - 1) {
        if (rules.dernierGel === rules.dernierSemi) html += '<div class="lastline" style="top:' + y(rules.dernierGel) + 'px"><span>Dernier départ ' + hfr(U.toHHMM(rules.dernierGel)) + '</span></div>';
        else {
          html += '<div class="lastline" style="top:' + y(rules.dernierGel) + 'px"><span>Dernier gel ' + hfr(U.toHHMM(rules.dernierGel)) + '</span></div>';
          html += '<div class="lastline" style="top:' + y(rules.dernierSemi) + 'px"><span>Dernier semi ' + hfr(U.toHHMM(rules.dernierSemi)) + '</span></div>';
        }
      }
    } else html += '<div class="off" style="top:0;bottom:0"></div>';
    bls.forEach(function (bl) {
      if (bl.praticienne !== 'tous' && bl.praticienne !== p.id) return;
      var s = bl.heureDebut ? U.toMin(bl.heureDebut) : 0, e = bl.heureFin ? U.toMin(bl.heureFin) : 1440;
      s = Math.max(s, t0); e = Math.min(e, t1);
      if (e <= s) return;
      html += '<div class="blk" data-act="bl" data-id="' + esc(bl.id) + '" style="top:' + y(s) + 'px;height:' + (e - s) * ppm + 'px"><span>' + I.lock + esc(bl.motif || 'Indisponible') + (bl.praticienne === 'tous' ? ' · salon' : '') + '</span></div>';
    });
    var items = rdvs.filter(function (r) { return r.type !== 'massage' && r.praticienne === p.id; }).map(function (r) {
      var s = U.toMin(r.debut), e = U.toMin(r.fin);
      return { r: r, s: s, e: e + (ACTIVE[r.statut] ? b : 0), end: e };
    });
    layoutLanes(items);
    items.forEach(function (it) {
      var r = it.r, top = y(it.s), hgt = Math.max((it.end - it.s) * ppm - 2, 18);
      var w = 100 / it.lanes, l = it.lane * w;
      var pos = 'left:calc(' + l + '% + 3px);width:calc(' + w + '% - 6px);';
      var segs = (r.segments || []).filter(function (sg) { return sg.lieu === 'cabine'; }).map(function (sg) {
        var st = (U.toMin(sg.debut) - it.s) * ppm, sh = (U.toMin(sg.fin) - U.toMin(sg.debut)) * ppm;
        return '<div class="seg-cab" style="top:' + st + 'px;height:' + sh + 'px"><span>' + I.foot + (sh > 34 && !(narrow() && cols.length > 1) ? 'Pieds · cabine' : '') + '</span></div>';
      }).join('');
      var tiny = hgt < 46;
      var tags = (r.statut === 'en_attente' ? '<span class="tag tag-wait">À valider</span>' : '') + (r.nouvelle ? '<span class="tag tag-new">Nouvelle</span>' : '');
      html += '<div class="card st-' + r.statut + (tiny ? ' tiny' : '') + '" role="button" tabindex="0" data-act="rdv" data-id="' + esc(r.id) + '" style="' + pos + 'top:' + top + 'px;height:' + hgt + 'px" aria-label="' + esc(fullName(r) + ', ' + hfr(r.debut)) + '">' + segs +
        '<span class="c-time">' + hfr(r.debut) + ' – ' + hfr(r.fin) + '</span><span class="c-name">' + esc(narrow() && cols.length > 1 ? shortName(r) : fullName(r)) + '</span>' +
        '<span class="c-svc">' + esc(r.services.map(abbr).join(' + ')) + '</span>' + (tags ? '<span class="c-tags">' + tags + '</span>' : '') + '</div>';
      if (ACTIVE[r.statut] && b) html += '<div class="buffer" style="' + pos + 'top:' + (y(it.end)) + 'px;height:' + b * ppm + 'px"></div>';
    });
    return '<div class="tl-col' + (p.active === false ? ' inactive' : '') + '" data-act="slot" data-prat="' + p.id + '">' + html + '</div>';
  }).join('');

  var massages = rdvs.filter(function (r) { return r.type === 'massage'; }).map(function (r) {
    var s = U.toMin(r.debut), e = U.toMin(r.fin), hgt = Math.max((e - s) * ppm - 2, 22);
    return '<div class="mcard st-' + r.statut + '" role="button" tabindex="0" data-act="rdv" data-id="' + esc(r.id) + '" style="top:' + y(s) + 'px;height:' + hgt + 'px">' +
      '<span class="m-title">' + I.leaf + 'Modelage — institut fermé aux ongles</span>' +
      '<span class="m-sub">' + hfr(r.debut) + ' – ' + hfr(r.fin) + ' · ' + esc(svcName(r.services[0])) + ' · ' + esc(pratName(r.praticienne)) + (fullName(r) ? ' · ' + esc(fullName(r)) : '') + (r.statut === 'en_attente' ? ' · à valider' : '') + '</span></div>' +
      (ACTIVE[r.statut] && b ? '<div class="mbuffer" style="top:' + y(e) + 'px;height:' + b * ppm + 'px"></div>' : '');
  }).join('');

  var now = '';
  if (d === today()) { var nm = nowMin(); if (nm > t0 && nm < t1) now = '<div class="now" style="top:' + y(nm) + 'px"><span>' + hfr2(U.toHHMM(nm)) + '</span></div>'; }
  var grid = 'background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px ' + 60 * ppm + 'px),repeating-linear-gradient(to bottom,var(--line-2) 0 1px,transparent 1px ' + 15 * ppm + 'px)';

  return (!rules ? '<div class="closed-banner">Jour normalement fermé — rendez-vous ajoutés manuellement.</div>' : '') +
    '<div class="tl" style="grid-template-columns:52px 1fr;height:' + H + 'px">' +
    '<div class="tl-gutter">' + gutter + '</div>' +
    '<div class="tl-cols" style="grid-template-columns:repeat(' + cols.length + ',minmax(0,1fr))"><div class="tl-grid" style="' + grid + '"></div>' + colsHtml +
    '<div class="massage-layer">' + massages + '</div>' + now + '</div></div><div style="height:30px"></div>';
}

function renderWeek(mon) {
  var ps = prats(), out = '';
  for (var i = 0; i < 7; i++) {
    var d = U.addDays(mon, i), jr = S.data.jours[d] || {}, rules = U.dayRules(S.cfg, d);
    var all = S.data.rdvs.filter(function (r) { return r.date === d && (S.showCancelled || ACTIVE[r.statut]); }).sort(function (a, b) { return a.debut.localeCompare(b.debut); });
    var bls = S.data.blocages.filter(function (x) { return x.du <= d && x.au >= d; });
    var closed = !rules && !all.length;
    var inner;
    if (closed) inner = '<div class="wk-closed">Fermé</div>';
    else {
      inner = '<div class="wk-cols" style="--n:' + ps.length + '">' + ps.map(function (p) {
        var list = all.filter(function (r) { return r.praticienne === p.id || r.type === 'massage'; });
        var cnt = list.filter(function (r) { return r.type !== 'massage' && ACTIVE[r.statut]; }).length;
        var items = bls.filter(function (x) { return x.praticienne === 'tous' || x.praticienne === p.id; }).map(function (x) {
          var l = blocLabel(x); return '<div class="wk-item bloc"><b>' + esc(l.heures === 'Journée' ? 'Jour' : l.heures.replace(/ \(.*\)/, '')) + '</b><span>' + esc(x.motif || 'Indispo') + '</span></div>';
        }).join('');
        items += list.map(function (r) {
          var cls = r.type === 'massage' ? 'mass' : r.statut === 'en_attente' ? 'wait' : ACTIVE[r.statut] ? '' : 'cancel';
          return '<div class="wk-item ' + cls + '"><b>' + hfr2(r.debut) + '</b><span>' + esc(r.type === 'massage' ? 'Modelage' + (r.praticienne === p.id ? '' : ' (' + pratName(r.praticienne) + ')') : shortName(r)) + '</span></div>';
        }).join('');
        return '<div class="wk-col"><h4>' + esc(p.nom) + '<span>' + cnt + '/' + S.cfg.maxClientesJour + '</span></h4>' + (items || '<div class="wk-none">Libre</div>') + '</div>';
      }).join('') + '</div>';
    }
    out += '<button class="wk-day' + (closed ? ' closed' : '') + (d === today() ? ' is-today' : '') + '" data-act="goday" data-date="' + d + '">' +
      '<div class="wk-date"><div class="d1">' + esc(wdShort(d)) + '</div><div class="d2">' + (+d.slice(8)) + '</div><div class="d3">' + (rules ? hfr(U.toHHMM(rules.debut)) + '–' + hfr(U.toHHMM(rules.fin)) + (jr.exception ? ' · except.' : '') : 'Fermé') + '</div></div>' + inner + '</button>';
  }
  return '<div class="week">' + out + '</div><div style="height:30px"></div>';
}

/* ================= Détail RDV ================= */
function findRdv(id) { return S.cache[id] || (S.data && S.data.rdvs.filter(function (r) { return r.id === id; })[0]); }
function rdvView(id) {

      : (r.segments || []).map(function (sg) {
        var cab = sg.lieu === 'cabine';

    dl += '<dt>Code</dt><dd class="mono">' + esc(r.code) + '</dd>';

    if (r.statut === 'en_attente') acts += '<button class="btn btn-sage" data-act="st" data-v="confirme">' + I.check + 'Valider</button><button class="btn btn-ghost" data-act="st" data-v="refuse">Refuser</button>';

      acts += '<button class="btn btn-ghost" data-act="st" data-v="annule">Annuler le RDV</button>';

    } else {

  v.onInput = function (el) {

      return true;

}
function setStatut(r, statut, forcer) {
  var prev = r.statut;
  var go = function (f) {
    return A('admin.statut', { id: r.id, statut: statut, forcer: !!f }).then(function (nr) {
      S.cache[nr.id] = nr;
      var msg = { confirme: prev === 'en_attente' ? 'Rendez-vous validé' : 'Rendez-vous confirmé', refuse: 'Demande refusée', annule: 'Rendez-vous annulé', absente: 'Marquée absente' }[statut];
      toast(msg, 'ok', statut !== 'confirme' ? { label: 'Rétablir', fn: function () { setStatut(nr, prev); } } : null);
      repaint(); refreshAll();
      if (S.tab === 'attente') loadAttente(true);
    }, function (e) {
      if (e.code === 'conflit' && !f) return askForce(e.message).then(function (ok) { if (ok) go(true); });

  }
  return go(forcer);
}

    return '<p style="margin:0 0 14px">' + esc(dateLong(date)) + '</p><div class="row2">' +
      [['debut', 'Ouverture'], ['fin', 'Fermeture'], ['dernierGel', 'Dernier départ gel'], ['dernierSemi', 'Dernier départ semi']].map(function (f) {
        return '<div class="field"><label>' + f[1] + '</label><input type="time" step="900" class="inp" data-k="' + f[0] + '" value="' + esc(st[f[0]]) + '"></div>';

    h += '<div class="card-s"><h3>Session</h3><p class="lead">Vous restez connectée 30 jours sur cet appareil.</p><button class="btn btn-ghost" data-act="logout">Se déconnecter</button></div>';
    h += '<div class="card-s"><h3>Réglages d\'origine</h3><p class="lead">Remet horaires, durées et textes comme au départ. Les rendez-vous ne sont pas touchés.</p><button class="btn btn-danger" data-act="cfg-reset">Rétablir les réglages d\'origine</button></div>';
    if (API.isDemo) h += '<div class="card-s"><h3>Mode démo</h3><p class="lead">Efface toutes les données fictives et recommence à zéro.</p><button class="btn btn-danger" data-act="demo-reset">Réinitialiser la démo</button></div>';
  }
  var noSave = t === 'indispos' || t === 'securite';
  var err = S.cfgErrors ? '<div class="errbox" role="alert"><b>Réglages non enregistrés :</b><ul>' + S.cfgErrors.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul></div>' : '';
  var sy = window.scrollY;
  el.innerHTML = '<div class="page"><div class="page-head"><div><div class="eyebrow">Salon</div><h1><em>Réglages</em></h1></div></div>' +
    '<div class="subtabs" role="tablist">' + SET_TABS.map(function (x) { return '<button role="tab" class="' + (t === x[0] ? 'on' : '') + '" data-act="settab" data-v="' + x[0] + '" aria-selected="' + (t === x[0]) + '">' + x[1] + '</button>'; }).join('') + '</div>' +
    '<div id="set-body">' + h + '</div>' + err +
    (S.dirty ? '<div class="savebar"><span>Modifications non enregistrées' + (noSave ? ' (autres onglets)' : '') + '</span><button class="btn btn-ghost btn-sm" data-act="cfg-cancel">Annuler</button><button class="btn btn-clay btn-sm" data-act="cfg-save">Enregistrer</button></div>' : '') + '</div>';
  window.scrollTo(0, sy);
  var tb = $('.subtabs .on', el); if (tb && tb.scrollIntoView && el.dataset.st !== t) { el.dataset.st = t; tb.scrollIntoView({ inline: 'center', block: 'nearest' }); window.scrollTo(0, sy); }
}
function settingsInput(el, ev) {
  if (el.dataset.pref) {
    var k = el.dataset.pref; S[k] = el.checked; LS.set(k, el.checked); return;
  }
  var path = el.dataset.path; if (!path) return;
  var type = el.dataset.type, val;
  if (type === 'bool') val = el.checked;
  else if (type === 'int') { if (el.value === '') return; val = parseInt(el.value, 10); if (isNaN(val)) return; }
  else if (type === 'text' && el.type === 'radio') { if (!el.checked) return; val = el.value; }
  else val = el.value;
  setPath(S.draft, path, val);
  var m = /^(semaine\.\d|exceptions\.[\d-]+)\.ouvert$/.exec(path);
  if (m && val) {
    var j = getPath(S.draft, m[1]);
    if (!j.debut) { j.debut = '09:00'; j.fin = '20:00'; j.dernierGel = '18:30'; j.dernierSemi = '19:00'; }
  }
  var wasDirty = S.dirty; S.dirty = true;
  if (el.dataset.repaint || !wasDirty || (ev && ev.type === 'change' && type === 'bool')) {
    if (el.dataset.repaint || !wasDirty) {
      var focusPath = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.path : null;
      renderSettings();
      if (focusPath && !el.dataset.repaint) { var f = document.querySelector('[data-path="' + focusPath + '"]'); if (f) { f.focus(); try { var L = f.value.length; f.setSelectionRange(L, L); } catch (x) { /* time inputs */ } } }
    }
  }
}
function saveConfig() {
  var btn = $('[data-act="cfg-save"]'); if (btn) { btn.disabled = true; btn.textContent = 'Enregistrement…'; }
  A('admin.sauverConfig', { config: S.draft }).then(function (c) {
    S.cfg = c; S.draft = clone(c); S.dirty = false; S.cfgErrors = null; renderSettings(); toast('Réglages enregistrés');
    loadPlanning(true, true);
  }, function (e) {
    S.cfgErrors = e.details && e.details.erreurs ? e.details.erreurs : [e.message];
    renderSettings();
    var b = $('#v-reglages .errbox'); if (b) b.scrollIntoView({ block: 'center' });
  });
}

/* ================= Événements ================= */
var ACT = {
  'tab': function (el) { switchTab(el.dataset.tab); },
  'add': function () { openSheet(addMenu({ date: S.date })); },
  'prev': function () { stepDay(-1); },
  'next': function () { stepDay(1); },
  'today': function () { goDate(today()); },
  'view': function (el) { S.view = el.dataset.v; LS.set('view', S.view); S.scrollPending = true; loadPlanning(false); },
  'refresh': function () { S.loading = true; renderPlanning(); refreshAll().then(function () { toast('Planning à jour'); }); },
  'prattab': function (el) { S.pratTab = el.dataset.v; LS.set('pratTab', S.pratTab); renderPlanning(); },
  'toggle-cancel': function () { S.showCancelled = !S.showCancelled; LS.set('showCancelled', S.showCancelled); renderPlanning(); },
  'goday': function (el) { goDate(el.dataset.date, 'jour'); },
  'rdv': function (el) { if (topView()) openSheet(rdvView(el.dataset.id)); else openSheet(rdvView(el.dataset.id)); },
  'bl': function (el, ev) { ev.stopPropagation(); openSheet(blocInfoView(el.dataset.id)); },
  'slot': function (el, ev) {
    var rect = el.getBoundingClientRect();
    var m = tlStart + (ev.clientY - rect.top) / PPM();
    m = Math.floor(m / 15) * 15;
    openSheet(addMenu({ date: S.date, prat: el.dataset.prat, heure: U.toHHMM(Math.max(0, Math.min(m, 1425))) }));
  },
  'open-exc': function (el) { openSheet(openExcView(el.dataset.date)); },
  'sheet-close': function () { closeSheet(true); },
  'sheet-back': function () { closeSheet(); },
  'pin': function (el) { pinKey(el.dataset.k); },
  'q-st': function (el) { var r = findRdv(el.dataset.id); if (r) setStatut(r, el.dataset.v); },
  'settab': function (el) { S.setTab = el.dataset.v; renderSettings(); if (S.setTab === 'indispos') loadBlocList(); window.scrollTo(0, 0); },
  'cfg-save': saveConfig,
  'cfg-cancel': function () { S.draft = clone(S.cfg); S.dirty = false; S.cfgErrors = null; renderSettings(); },
  'exc-add': function () {
    var d = $('#exc-new').value; if (!d) return;
    S.draft.exceptions = S.draft.exceptions || {};
    if (S.draft.exceptions[d]) { toast('Cette date existe déjà.', 'err'); return; }
    var base = S.draft.semaine[String(U.weekday(d))];
    S.draft.exceptions[d] = base && base.ouvert ? clone(base) : { ouvert: true, debut: '09:00', fin: '20:00', dernierGel: '18:30', dernierSemi: '19:00' };
    S.dirty = true; renderSettings();
  },
  'exc-del': function (el) { delete S.draft.exceptions[el.dataset.k]; S.dirty = true; renderSettings(); },
  'bl-add': function () { openSheet(blocView({ date: U.addDays(today(), 1) })); },
  'bl-del': function (el) { delBloc(el.dataset.id, function () { loadBlocList(); }); },
  'pin-change': function () {
    var o = $('#pin-old').value, n = $('#pin-new').value, n2 = $('#pin-new2').value;
    if (!/^\d{4,8}$/.test(n)) { toast('Le nouveau code doit faire 4 à 8 chiffres.', 'err'); return; }
    if (n !== n2) { toast('Les deux nouveaux codes ne correspondent pas.', 'err'); return; }
    A('admin.changerPin', { ancien: o, nouveau: n }).then(function (res) {
      API.setToken(res.token); ['#pin-old', '#pin-new', '#pin-new2'].forEach(function (s) { $(s).value = ''; }); toast('Code PIN modifié');
    }, fail);
  },
  'logout': function () {
    dialog({ title: 'Se déconnecter ?', text: 'Il faudra retaper le code PIN sur cet appareil.', ok: 'Se déconnecter' }).then(function (ok) {
      if (!ok) return; API.logout(); S.data = null; S.range = null; S.draft = null; S.cache = {}; S.attente = null; showLogin();
    });
  },
  'cfg-reset': function () {
    dialog({ title: 'Rétablir les réglages d\'origine ?', text: 'Horaires, durées, textes et options reviendront à leur valeur de départ.', ok: 'Rétablir', danger: true }).then(function (ok) {
      if (!ok) return;
      A('admin.reinitialiserConfig').then(function (c) { S.cfg = c; S.draft = clone(c); S.dirty = false; S.cfgErrors = null; renderSettings(); toast('Réglages d\'origine rétablis'); loadPlanning(true, true); }, fail);
    });
  },
  'demo-reset': function () {
    dialog({ title: 'Réinitialiser la démo ?', text: 'Toutes les données fictives seront recréées.', ok: 'Réinitialiser', danger: true }).then(function (ok) {
      if (!ok) return; API.resetDemo(); location.reload();
    });
  }
};

document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-act]');
  if (!el || el.disabled) return;
  var act = el.dataset.act, v = topView();
  if (v && el.closest('#sheet') && v.on && v.on(act, el, ev)) return;
  if (ACT[act]) ACT[act](el, ev);
});
document.addEventListener('keydown', function (ev) {
  if (!$('#login').hidden) {
    if (/^\d$/.test(ev.key)) pinKey(ev.key);
    else if (ev.key === 'Backspace') pinKey('del');
    else if (ev.key === 'Enter') pinKey('ok');
    return;
  }
  if (ev.key === 'Escape') { if ($('#dialog').innerHTML) return; if (topView()) closeSheet(); return; }
  var t = ev.target;
  if ((ev.key === 'Enter' || ev.key === ' ') && t.matches && t.matches('[role="button"][data-act]')) { ev.preventDefault(); t.click(); }
  if (S.tab === 'planning' && !topView() && !/INPUT|TEXTAREA|SELECT/.test(t.tagName)) {
    if (ev.key === 'ArrowLeft') stepDay(-1);
    if (ev.key === 'ArrowRight') stepDay(1);
  }
});
function onField(ev) {
  var el = ev.target;
  if (el.id === 'datepick') { if (el.value && ev.type === 'change') goDate(el.value); return; }
  if (el.id === 'q') { clearTimeout(searchT); var q = el.value; searchT = setTimeout(function () { doSearch(q); }, 280); return; }
  var v = topView();
  if (v && el.closest('#sheet')) { if (v.onInput) v.onInput(el, ev); return; }
  if (el.closest('#v-reglages')) {
    if (ev.type === 'input' && (el.type === 'checkbox' || el.type === 'radio')) return;
    if (ev.type === 'change' && !(el.type === 'checkbox' || el.type === 'radio')) return;
    settingsInput(el, ev);
  }
}
document.addEventListener('input', onField);
document.addEventListener('change', onField);

window.addEventListener('sorelle:logout', function () {
  closeSheet(true); $('#dialog').innerHTML = '';
  S.data = null; S.range = null; S.draft = null;
  if ($('#login').hidden) { showLogin(); pinErr = 'Session expirée, reconnectez-vous.'; renderLogin(); }
});

/* Rafraîchissement auto */
function autoRefresh() {
  if (!API.isLoggedIn() || $('#app').hidden || document.visibilityState !== 'visible') return;
  refreshAll();
}
setInterval(autoRefresh, 60000);
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') autoRefresh(); });
var lastW = window.innerWidth;
window.addEventListener('resize', function () {
  var w = window.innerWidth;
  if ((w < 700) !== (lastW < 700) || Math.abs(w - lastW) > 80) { lastW = w; if (S.tab === 'planning') renderPlanning(); }
});

/* Tirer pour actualiser (planning) */
(function () {
  var y0 = null, dy = 0, ptr = $('#ptr');
  ptr.innerHTML = I.refresh + '<span>Relâcher pour actualiser</span>';
  window.addEventListener('touchstart', function (e) {
    y0 = (S.tab === 'planning' && !topView() && window.scrollY <= 0 && !$('#app').hidden) ? e.touches[0].clientY : null; dy = 0;
  }, { passive: true });
  window.addEventListener('touchmove', function (e) {
    if (y0 == null) return; dy = e.touches[0].clientY - y0;
    if (dy > 10) ptr.style.transform = 'translate(-50%,' + Math.min(dy - 80, 10) + 'px)';
  }, { passive: true });
  window.addEventListener('touchend', function () {
    if (y0 != null && dy > 80) { ptr.querySelector('svg').classList.add('spin'); refreshAll().then(function () { ptr.style.transform = ''; ptr.querySelector('svg').classList.remove('spin'); }); }
    else ptr.style.transform = '';
    y0 = null;
  });
})();

/* Démarrage */
if (API.isDemo) { $('#demo-strip').hidden = false; document.body.classList.add('has-demo'); }
if (API.isLoggedIn()) startApp(); else showLogin();
})();
</script>
</body>
</html>
