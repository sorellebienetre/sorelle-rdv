<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sorelle Planning">
<meta name="theme-color" content="#F5EFE3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14160F" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<title>Sorelle · Planning</title>
<link rel="icon" href="../assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<script>
/* Thème appliqué avant le premier affichage (évite un flash clair en mode sombre) */
(function () {
  var p = 'auto';
  try { var v = localStorage.getItem('sorelle_ui_theme'); if (v) p = JSON.parse(v); } catch (e) { /* défaut */ }
  var dark = p === 'dark' || (p !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
})();
</script>
<style>
/* =====================================================================
   Jetons de thème (partagés avec stats.js, clientes.js, magie.js)
   ===================================================================== */
:root{
  color-scheme:light;
  --bg:#F5EFE3; --surface:#FBF7EE; --surface-2:#F0E8D8;
  --text:#2A2F23; --text-sub:#5A6453; --muted:#8E9583;
  --line:rgba(30,34,24,.11); --accent:#5E7052; --accent-text:#FFFFFF; --clay:#C97B5A;
  --sage:#6F8161; --ok:#4F7A43; --warn:#A86A12; --danger:#A8432F; --focus:#1E2218;
  --shadow:0 1px 2px rgba(30,34,24,.06),0 8px 24px rgba(30,34,24,.08);
  --radius:12px; --radius-lg:18px;
  /* jetons internes du shell */
  --ink:#1E2218; --line-2:rgba(30,34,24,.05); --line-3:rgba(30,34,24,.18);
  --inv-bg:#1E2218; --inv-fg:#FBF7EE; --inv-sub:rgba(251,247,238,.72);
  --hover:rgba(30,34,24,.045); --press:#E7DCC5;
  --now:#C8432B; --wait:#7E2E1E; --wait-bg:#F6E0D9; --wait-fg:#7E2E1E;
  --sage-bg:#ECF0E0; --sage-fg:#3A4A2F; --sage-line:#B5C2A5;
  --clay-bg:#F7E6DC; --clay-fg:#7A4128; --clay-line:rgba(168,95,63,.3);
  --err-bg:#F6E0D9; --err-fg:#7E2E1E;
  --off:#EFE7D7; --lunch:rgba(138,157,122,.08); --buffer:rgba(30,34,24,.04);
  --blk:#ECEBE6; --blk-stripe:rgba(60,66,51,.07);
  --backdrop:rgba(30,34,24,.38); --backdrop-side:rgba(30,34,24,.2);
  --brand:#5E7052; --brand-fg:#FFFFFF; --brand-2:#4F6046;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  --nav-w:0px; --tab-h:0px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#14160F; --surface:#1D2018; --surface-2:#262A20;
  --text:#E9E4D6; --text-sub:#B4B09F; --muted:#858876;
  --line:rgba(233,228,214,.12); --accent:#A9BC97; --accent-text:#151A10; --clay:#D99476;
  --sage:#9DB08C; --ok:#8FBF7F; --warn:#E2AE58; --danger:#EC8670; --focus:#E9E4D6;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.35);
  --ink:#F4EFE3; --line-2:rgba(233,228,214,.06); --line-3:rgba(233,228,214,.2);
  --inv-bg:#E9E4D6; --inv-fg:#16180F; --inv-sub:rgba(22,24,15,.7);
  --hover:rgba(233,228,214,.06); --press:#30352A;
  --now:#F07257; --wait:#F09C86; --wait-bg:#3B241D; --wait-fg:#F6B7A6;
  --sage-bg:#232B1D; --sage-fg:#C5D6B4; --sage-line:#4F6142;
  --clay-bg:#35231A; --clay-fg:#EDB69B; --clay-line:rgba(210,137,106,.4);
  --err-bg:#3B221C; --err-fg:#F6B7A6;
  --off:#181A13; --lunch:rgba(157,176,140,.07); --buffer:rgba(233,228,214,.05);
  --blk:#2A2D25; --blk-stripe:rgba(233,228,214,.06);
  --backdrop:rgba(0,0,0,.55); --backdrop-side:rgba(0,0,0,.4);
  --brand:#7F946E; --brand-fg:#10130C;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow-x:hidden;touch-action:manipulation;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent}
input,select,textarea{font-size:16px}
[hidden]{display:none!important}
h1,h2,h3,h4{font-family:var(--sans);font-weight:600;margin:0;color:var(--ink);letter-spacing:-.01em}
svg{display:block}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* ---------- Boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;font-size:15px;font-weight:500;line-height:1;white-space:nowrap;border:1px solid transparent;transition:background .2s,color .2s,border-color .2s}
.btn:active{transform:scale(.98)}
.btn svg{width:17px;height:17px;flex:none}
.btn-ink{background:var(--inv-bg);color:var(--inv-fg)}
.btn-ink:hover{opacity:.92}
.btn-accent{background:var(--accent);color:var(--accent-text)}
.btn-accent:hover{filter:brightness(.95)}
.btn-sage{background:var(--brand);color:var(--brand-fg)}
.btn-ghost{border-color:var(--line-3);background:var(--surface);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink)}
.btn-danger{border-color:color-mix(in srgb,var(--danger) 40%,transparent);color:var(--danger);background:var(--surface)}
.btn-danger:hover{background:var(--danger);color:var(--surface)}
.btn-fill{background:linear-gradient(180deg,#6A7D5D,#55684A);color:#fff;border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 1px 2px rgba(30,34,24,.18),0 6px 16px -8px rgba(79,96,70,.7)}
.btn-fill:hover{filter:brightness(1.05)}
.btn-fill svg{color:#F3E3B5}
:root[data-theme="dark"] .btn-fill{background:linear-gradient(180deg,#7F946E,#68805A);color:#10130C}
:root[data-theme="dark"] .btn-fill svg{color:#3A2A10}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-sm{min-height:38px;padding:0 14px;font-size:14px}
.icon-btn{width:44px;height:44px;border-radius:999px;display:grid;place-items:center;color:var(--ink);flex:none;position:relative}
.icon-btn:hover{background:var(--hover)}
.icon-btn svg{width:21px;height:21px}
.icon-btn.on{background:var(--inv-bg);color:var(--inv-fg)}
.icon-btn .dot{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--surface)}
.link-btn{color:var(--ink);font-weight:500;text-decoration:underline;text-underline-offset:3px;min-height:44px;padding:0 4px;display:inline-flex;align-items:center;gap:6px}
.link-btn svg{width:16px;height:16px}
.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Segmenté ---------- */
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px;max-width:100%;box-shadow:inset 0 0 0 1px var(--line-2)}
.seg button{min-height:38px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:500;color:var(--text-sub);white-space:nowrap;flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
:root[data-theme="dark"] .seg button.on{background:#383D31}
.seg button svg{width:17px;height:17px}
.seg.full{display:flex;width:100%}

/* Pastilles praticienne / couleur */
.pdot{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--c);color:var(--fc,#fff);font-size:12px;font-weight:600;display:inline-grid;place-items:center;flex:none;line-height:1}
.pdot.sm{width:10px;height:10px;font-size:0}
.pdot.md{width:20px;height:20px;font-size:11px}
.pdot.xl{width:44px;height:44px;font-size:18px}
.swi{width:12px;height:12px;border-radius:4px;background:var(--c);display:inline-block;flex:none;box-shadow:inset 0 0 0 1px var(--line-3)}

/* ---------- Bandeau démo ---------- */
#demo-strip{background:var(--inv-bg);color:var(--inv-fg);font-size:11.5px;font-weight:500;text-align:center;padding:calc(3px + var(--safe-t)) 12px 3px;margin-left:var(--nav-w);position:relative;z-index:41}
body.has-demo #login{min-height:calc(100dvh - 22px)}

/* ---------- Connexion ---------- */
#login{min-height:100dvh;display:grid;place-items:center;padding:32px 16px calc(32px + var(--safe-b));background:var(--surface)}
.login-box{width:100%;max-width:340px;text-align:center}
.login-logo{display:block;width:176px;height:176px;border-radius:36px;margin:0 auto 18px;object-fit:cover;box-shadow:0 1px 2px rgba(30,34,24,.08),0 18px 40px -12px rgba(79,96,70,.35)}
.login-box h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.brand-serif{font-family:var(--serif);font-weight:600;letter-spacing:.01em}
.login-box p.pbar{color:var(--text-sub);margin:0 0 26px}
.pin-dots{display:flex;justify-content:center;gap:14px;height:22px;align-items:center;margin-bottom:10px}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink);display:block}
.pin-dots i.on{background:var(--ink)}
.pin-err{min-height:22px;color:var(--danger);font-size:14px;margin-bottom:12px}
.pin-pad{display:grid;grid-template-columns:repeat(3,76px);gap:16px 22px;justify-content:center}
.pin-pad button{width:76px;height:76px;border-radius:50%;background:var(--bg);font-size:28px;font-weight:400;color:var(--ink);display:grid;place-items:center}
.pin-pad button:active{background:var(--press)}
.pin-pad button.ghost{background:transparent;font-size:15px;color:var(--text-sub)}
.pin-pad button svg{width:24px;height:24px}
.login-box .btn{margin-top:26px;width:100%}
.demo-hint{margin-top:18px;font-size:14px;color:var(--text-sub)}
.shake{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* ---------- Navigation ---------- */
#nav{position:fixed;z-index:40;background:var(--surface);display:flex}
.nav-brand{display:none}
.nav-tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:500;min-height:44px;flex:1}
.nav-tab svg{width:23px;height:23px}
.nav-tab.on{color:var(--ink)}
.nav-badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--now);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 5px}
.nav-add{display:none}
#fab{position:fixed;z-index:41;right:16px;bottom:calc(var(--tab-h) + 16px);width:58px;height:58px;border-radius:50%;background:var(--inv-bg);color:var(--inv-fg);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#fab svg{width:26px;height:26px}
#fab:active{transform:scale(.95)}
#fill-fab{position:fixed;z-index:41;left:16px;bottom:calc(var(--tab-h) + 20px);min-height:50px;padding:0 18px 0 14px;border-radius:999px;background:linear-gradient(180deg,#6A7D5D,#55684A);color:#fff;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.22)}
#fill-fab svg{width:20px;height:20px;color:#F3E3B5}
#fill-fab:active{transform:scale(.97)}
@media (min-width:700px){#fill-fab{display:none}}
@media (max-width:999px){
  :root{--tab-h:calc(62px + var(--safe-b))}
  #nav{left:0;right:0;bottom:0;height:var(--tab-h);padding-bottom:var(--safe-b);border-top:1px solid var(--line)}
}
@media (min-width:1000px){
  :root{--nav-w:96px}
  #nav{top:0;bottom:0;left:0;width:var(--nav-w);flex-direction:column;align-items:stretch;border-right:1px solid var(--line);padding:16px 8px;gap:6px}
  .nav-brand{display:block;width:46px;height:46px;border-radius:13px;margin:4px auto 16px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.12),0 6px 16px -6px rgba(79,96,70,.45)}
  .nav-brand img{display:block;width:100%;height:100%}
  .nav-tab{flex:none;min-height:68px;border-radius:14px;font-size:11.5px;text-align:center;line-height:1.15;padding:0 2px}
  .nav-tab.on{background:var(--bg)}
  .nav-badge{left:calc(50% + 4px);top:8px}
  .nav-add{display:grid;place-items:center;margin-top:auto;width:58px;height:58px;border-radius:50%;background:var(--inv-bg);color:var(--inv-fg);align-self:center}
  .nav-add svg{width:24px;height:24px}
  #fab{display:none}
}
#main{margin-left:var(--nav-w);padding-bottom:calc(var(--tab-h) + 24px);min-height:100dvh}

/* ---------- Planning : en-tête ---------- */
.plan-head{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.tb{display:flex;align-items:center;gap:8px 10px;padding:calc(8px + var(--safe-t)) 10px 4px 16px;min-height:56px}
body.has-demo .tb{padding-top:8px}
.tb-date{position:relative;flex:1 1 auto;min-width:0;display:flex;flex-direction:column;align-items:flex-start;padding:2px 0}
.tb-rel{font-size:13px;color:var(--text-sub);font-weight:500;white-space:nowrap}
.tb-date h1{font-size:21px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;display:flex;align-items:center;gap:6px}
.tb-date h1 svg{width:16px;height:16px;color:var(--muted);flex:none}
.tb-date input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;-webkit-appearance:none;appearance:none;border:0}
.tb-date input::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.tb-nav{display:flex;align-items:center;gap:2px;flex:none}
.tb-tools{display:flex;align-items:center;gap:6px;flex:none;margin-left:auto}
.tb-tools .lbl{display:none}
.pbar{display:flex;align-items:center;gap:8px;padding:2px 16px 10px;flex-wrap:wrap}
.pbar .grow{flex:1 1 auto}
.pbar .seg button{padding:0 12px}
.pbar .tb-nav{margin-left:-8px}
@media (max-width:699px){
  .pbar .seg.v3 button{padding:0 11px}
  .pbar .seg.prat{flex:1 1 auto}
}
@media (min-width:700px){
  .tb{padding:14px 16px 8px 24px;gap:10px 14px}
  .tb-date h1{font-size:23px}
  .tb-date{flex:0 1 auto;margin-right:6px}
  .tb-tools .lbl{display:inline}
  .pbar{padding:0 24px 12px;gap:10px}
}
@media (min-width:1100px){.tb-date h1{font-size:25px}}
@media (max-width:1099px){.tb-tools .hide-md{display:none}}
@media (min-width:700px) and (max-width:1279px){.pbar .tb-nav{margin-left:-8px}}
@media (max-width:999px){.tb-tools .hide-sm{display:none}}

/* Résumé du jour + légende */
.daysum{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:0 16px 10px;font-size:14px;color:var(--text)}
.ds-i{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.ds-i b{font-weight:600;color:var(--ink)}
.ds-sep{color:var(--muted)}
.ds-wait{color:var(--wait-fg);font-weight:500}
.ds-fill{margin-left:auto;display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--sage-fg);background:var(--sage-bg);border:1px solid var(--sage-line)}
.ds-fill svg{width:15px;height:15px;color:var(--clay)}
.ds-fill+.ds-leg{margin-left:0}
.ds-leg{margin-left:auto;display:inline-flex;align-items:center;gap:4px;min-height:32px;padding:0 10px;border-radius:999px;font-size:13px;color:var(--text-sub);border:1px solid var(--line-3);background:var(--surface)}
.ds-leg svg{width:14px;height:14px;transition:transform .2s}
.ds-leg[aria-expanded="true"] svg{transform:rotate(180deg)}
.clegend{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 12px}
.lg{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 10px;border-radius:8px;font-size:12.5px;font-weight:500;white-space:nowrap}
.lg-t{font-size:12.5px;color:var(--text-sub);align-self:center;margin-right:2px}
.lg-br{flex-basis:100%;height:0}
@media (min-width:700px){.daysum,.clegend{padding-left:24px;padding-right:24px}}

/* Colonnes */
.col-heads{display:grid;padding:0 16px 0 0;border-top:1px solid var(--line-2)}
.col-head{padding:8px 10px 7px;display:flex;align-items:center;gap:8px;min-width:0;border-bottom:3px solid var(--pc)}
.col-head .nm{font-size:17px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col-head .cnt{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-sub);white-space:nowrap}
.col-head.narrow{flex-wrap:wrap;gap:2px 6px}
.col-head.narrow .nm{font-size:15px}
.col-head.narrow .cnt{margin-left:0;flex-basis:100%;font-size:12px}
@media (min-width:700px){.col-heads{padding-right:24px}}
.gbar{display:inline-block;position:relative;width:46px;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;flex:none;box-shadow:inset 0 0 0 1px var(--line-2)}
.gbar i{position:absolute;left:0;top:0;bottom:0;background:var(--pc);border-radius:3px}
.gbar.full i{background:var(--pc)}

/* ---------- Timeline ---------- */
.plan-body{padding:0 16px 0 0;position:relative}
@media (min-width:700px){.plan-body{padding-right:24px}}
.tl{position:relative;display:grid;margin-top:10px}
.tl-gutter{position:relative}
.tl-gutter .hl{position:absolute;right:8px;transform:translateY(-50%);font-size:12px;color:var(--muted)}
.tl-gutter .hl:first-child{transform:none}
.tl-cols{position:relative;display:grid;background:var(--surface);border-radius:12px;box-shadow:0 0 0 1px var(--line)}
.tl-grid{position:absolute;inset:0;pointer-events:none;border-radius:12px}
.tl-col{position:relative;border-left:1px solid var(--line);cursor:copy}
.tl-col:first-of-type{border-left:0}
.tl-col.inactive{background:var(--off)}
.off{position:absolute;left:0;right:0;background:var(--off);pointer-events:none}
.lunch{position:absolute;left:0;right:0;background:var(--lunch);pointer-events:none}
.lunch span{position:absolute;right:8px;top:4px;font-size:11.5px;color:var(--muted)}
.blk{position:absolute;left:3px;right:3px;border-radius:8px;background:var(--blk) repeating-linear-gradient(135deg,var(--blk-stripe) 0 2px,transparent 2px 10px);color:var(--text-sub);font-size:13px;padding:7px 9px;overflow:hidden;cursor:pointer;z-index:1}
.blk span{display:inline-flex;align-items:center;gap:6px;font-weight:500}
.blk svg{width:13px;height:13px}
.buffer{position:absolute;pointer-events:none;background:var(--buffer);border-radius:0 0 6px 6px;z-index:1}
.freez{position:absolute;left:4px;right:4px;border-radius:10px;border:1.5px dashed color-mix(in srgb,var(--pc) 55%,transparent);background:color-mix(in srgb,var(--pc) 7%,transparent);color:var(--text-sub);z-index:1;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:1px;padding:6px 10px;text-align:left;overflow:hidden;font-size:12.5px;line-height:1.25}
.freez:hover{background:color-mix(in srgb,var(--pc) 13%,transparent)}
.freez b{font-weight:600;color:var(--ink);font-size:13px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.freez b svg{width:14px;height:14px}
.freez span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.freez.tiny{flex-direction:row;align-items:center;padding:0 8px}
.freez.tiny span{display:none}
.evc{position:absolute;border-radius:10px;padding:6px 9px 6px 13px;overflow:hidden;cursor:pointer;z-index:2;font-size:13px;line-height:1.25;display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--cbg);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.evc::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--bd);z-index:1}
.evc>span{position:relative;z-index:1}
.evc .c-time{font-size:12.5px;font-weight:500;color:var(--sub);white-space:nowrap}
.evc .c-name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evc .c-svc{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evc .c-wait{align-self:flex-start;margin-top:2px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--wait);color:var(--surface)}
.c-part{position:absolute;left:0;right:0;z-index:0;display:flex;align-items:flex-end;justify-content:flex-end;padding:3px 7px;border-top:1px solid rgba(0,0,0,.1)}
.c-pl{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:500;color:var(--sub);white-space:nowrap}
.c-pl svg{width:14px;height:14px}
.evc.st-en_attente{outline:2px dashed var(--wait);outline-offset:-2px}
.evc.st-annule,.evc.st-refuse,.evc.st-absente{opacity:.5;z-index:1}
.evc.st-annule .c-name,.evc.st-refuse .c-name,.evc.st-absente .c-name{text-decoration:line-through}
.evc.tiny{flex-direction:row;align-items:center;gap:8px;padding:2px 8px 2px 12px}
.evc.tiny .c-svc,.evc.tiny .c-wait{display:none}
.evc.tiny .c-name{font-size:13.5px}
.evc:hover{filter:brightness(.97)}
.massage-layer{position:absolute;inset:0;pointer-events:none;z-index:3}
.mcard{position:absolute;left:0;right:0;pointer-events:auto;border-radius:8px;background:var(--cbg);color:var(--fg);box-shadow:inset 0 0 0 2px var(--bd),0 2px 8px rgba(0,0,0,.15);padding:6px 12px 6px 16px;cursor:pointer;display:flex;flex-direction:column;gap:1px;overflow:hidden;font-size:13px}
.mcard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--pc)}
.mcard .m-title{font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard .m-title svg{width:16px;height:16px;flex:none}
.mcard .m-sub{color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard.st-en_attente{outline:2px dashed var(--wait);outline-offset:-2px}
.mcard.st-annule,.mcard.st-refuse,.mcard.st-absente{opacity:.45}
.mbuffer{position:absolute;left:0;right:0;background:var(--buffer);pointer-events:none}
.now{position:absolute;left:-6px;right:0;height:0;border-top:2px solid var(--now);z-index:5;pointer-events:none}
.now::before{content:'';position:absolute;left:-4px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--now)}
.now span{position:absolute;left:-52px;top:-10px;font-size:11.5px;font-weight:600;color:#fff;background:var(--now);border-radius:6px;padding:1px 5px}
.closed-banner{margin:10px 0 0 52px;padding:10px 14px;border-radius:12px;background:var(--surface-2);color:var(--text);font-size:14px}

/* Vide / fermé / bientôt */
.vide{display:flex;flex-direction:column;align-items:center;text-align:center;padding:64px 24px;gap:10px;color:var(--text-sub)}
.vide h2{font-size:24px}
.vide .ill{width:64px;height:64px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--sage);box-shadow:0 0 0 1px var(--line)}
.vide .ill svg{width:28px;height:28px}
.vide p{max-width:380px;margin:0 0 8px}
.loading{display:flex;justify-content:center;align-items:center;gap:10px;padding:60px 20px;color:var(--muted)}
.loading svg{width:20px;height:20px}

/* ---------- Vue semaine ---------- */
.week{display:flex;flex-direction:column;gap:10px;padding:14px 0 0 16px}
.wk-day{display:grid;grid-template-columns:64px 1fr;gap:12px;background:var(--surface);border-radius:var(--radius);padding:12px;text-align:left;box-shadow:0 0 0 1px var(--line);width:100%;min-width:0}
.wk-day:hover{box-shadow:0 0 0 1px var(--line-3)}
.wk-day.closed{background:transparent;box-shadow:0 0 0 1px var(--line-2);opacity:.6}
.wk-day.is-today{box-shadow:0 0 0 2px var(--ink)}
.wk-date .d1{font-size:13px;font-weight:500;color:var(--text-sub)}
.wk-date .d2{font-size:28px;font-weight:600;line-height:1.05;color:var(--ink)}
.wk-date .d2 small{font-size:.5em;font-weight:500;color:var(--text-sub);margin-left:3px;white-space:nowrap}
.wk-date .d3{font-size:12px;color:var(--muted);margin-top:4px}
.wk-cols{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:10px;min-width:0}
.wk-col{min-width:0}
.wk-col h4{margin:0 0 4px;font-size:13.5px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:6px;min-width:0}
.wk-col h4 .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk-g{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-sub);margin:0 0 6px;white-space:nowrap}
.wk-g .gbar{width:auto;flex:1;max-width:70px}
.wk-g .pl{color:var(--sage-fg);font-weight:500}
.wk-g .pl.none{color:var(--muted);font-weight:400}
.wk-item{display:flex;gap:6px;font-size:13px;padding:4px 7px 4px 9px;border-radius:6px;margin-bottom:3px;white-space:nowrap;overflow:hidden;min-width:0;background:var(--cbg);color:var(--fg);box-shadow:inset 3px 0 0 var(--bd)}
.wk-item b{font-weight:500;font-size:12px;opacity:.78;flex:none;padding-top:1px}
.wk-item span{overflow:hidden;text-overflow:ellipsis}
.wk-item.wait{outline:1.5px dashed var(--wait);outline-offset:-1.5px}
.wk-item.bloc{background:var(--blk);color:var(--text-sub);box-shadow:none}
.wk-item.mass{font-weight:600}
.wk-item.cancel{opacity:.5;text-decoration:line-through}
.wk-none{font-size:12.5px;color:var(--muted)}
.wk-closed{color:var(--muted);font-size:14px;align-self:center}
@media (min-width:700px){.wk-day.closed .wk-date .d3,.wk-day.closed .wk-closed{display:none}.wk-day.closed .wk-date::after{content:"Fermé";flex-basis:100%;font-size:12px;color:var(--muted)}}
@media (min-width:700px){
  .week{padding-left:24px;display:grid;grid-template-columns:var(--wcols,repeat(7,minmax(0,1fr)));gap:8px}
  .wk-day{grid-template-columns:1fr;align-content:start;min-height:320px;padding:10px 8px;gap:8px}
  .wk-cols{grid-template-columns:1fr;gap:12px}
  .wk-date{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
  .wk-date .d2{font-size:22px}
  .wk-date .d3{flex-basis:100%;margin-top:0}
  .wk-item{padding:3px 5px 3px 7px;font-size:12.5px;gap:4px}
  .wk-item b{font-size:11.5px}
}
@media (min-width:1280px){.week{gap:10px}.wk-day{padding:12px}}

/* ---------- Vue mois ---------- */
.mo-wrap{padding:12px 0 0 16px}
@media (min-width:700px){.mo-wrap{padding-left:24px}}
.mo-bar{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;margin-bottom:10px}
.mo-bar .hint{flex:1 1 200px}
.mo-wd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:0 16px 6px 16px;font-size:12px;font-weight:500;color:var(--muted);text-align:center}
@media (min-width:700px){.mo-wd{padding:0 24px 8px 24px;gap:6px;font-size:13px}}
.mo-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
@media (min-width:700px){.mo-grid{gap:6px}}
.mo-cell{position:relative;min-height:74px;border-radius:10px;background:var(--surface);box-shadow:0 0 0 1px var(--line);padding:5px 5px 6px;display:flex;flex-direction:column;align-items:stretch;gap:4px;text-align:left;min-width:0;overflow:hidden}
.mo-cell:hover{box-shadow:0 0 0 1px var(--line-3)}
.mo-cell.out{opacity:.4}
.mo-cell.closed{background:transparent;box-shadow:0 0 0 1px var(--line-2)}
.mo-cell.closed .mo-num{color:var(--muted)}
.mo-cell.past .mo-l{opacity:.7}
.mo-cell.today{box-shadow:0 0 0 2px var(--ink)}
.mo-num{font-size:14px;font-weight:600;color:var(--ink);line-height:1.1;display:flex;align-items:center;gap:4px}
.mo-num .w{width:7px;height:7px;border-radius:50%;background:var(--wait)}
.mo-l{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--text-sub);min-width:0;white-space:nowrap}
.mo-l .gbar{flex:1;width:auto;min-width:10px;height:5px}
.mo-l b{font-weight:600;color:var(--ink);font-size:11.5px}
.mo-l .nm{display:none;overflow:hidden;text-overflow:ellipsis}
.mo-t{display:flex;align-items:center;justify-content:center;gap:4px;min-height:22px;border-radius:6px;font-size:12.5px;font-weight:600;background:var(--tbg);color:var(--tfg);white-space:nowrap;overflow:hidden;padding:0 4px}
.mo-t.zero{background:transparent;color:var(--muted);font-weight:400;box-shadow:inset 0 0 0 1px var(--line)}
.mo-t .nm{display:none;font-weight:500}
.mo-closed{font-size:11px;color:var(--muted)}
@media (min-width:700px){
  .mo-cell{min-height:96px;padding:8px 8px 8px;gap:5px}
  .mo-num{font-size:16px}
  .mo-l{font-size:12.5px;gap:6px}
  .mo-l .nm{display:inline;flex:0 1 auto;max-width:48%}
  .mo-l b{font-size:12.5px}
  .mo-t{justify-content:flex-start;padding:0 8px;font-size:13px;min-height:24px}
  .mo-t .nm{display:inline}
}
@media (min-width:1100px){.mo-cell{min-height:110px}}
.mo-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--text-sub);margin:10px 0 0}
.mo-legend span{display:inline-flex;align-items:center;gap:6px}

/* ---------- Pages ---------- */
.page{max-width:900px;margin:0 auto;padding:calc(18px + var(--safe-t)) 16px 24px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 18px}
.page-head h1{font-size:28px;line-height:1.1}
.page-sub{margin:4px 0 0;color:var(--text-sub);font-size:14px}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border-radius:var(--radius);box-shadow:inset 4px 0 0 var(--pc,transparent),0 0 0 1px var(--line);padding:14px;display:flex;flex-direction:column;gap:8px}
.item-main{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%}
.item-date{flex:none;width:56px;text-align:center;border-right:1px solid var(--line);padding-right:10px}
.item-date .d1{font-size:12.5px;font-weight:500;color:var(--text-sub)}
.item-date .d2{font-size:24px;font-weight:600;line-height:1.05;color:var(--ink)}
.item-date .d3{font-size:12px;color:var(--muted)}
.item-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.item-body .nm{font-weight:600;font-size:16px;color:var(--ink);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item-body .meta{color:var(--text-sub);font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.item-actions{display:flex;gap:8px;justify-content:flex-end}
.item-actions .btn{flex:1;max-width:200px}
.pill{display:inline-flex;align-items:center;font-size:12px;padding:3px 9px;border-radius:999px;font-weight:600;white-space:nowrap}
.pill.confirme{background:var(--sage-bg);color:var(--sage-fg)}
.pill.en_attente{background:var(--wait);color:var(--surface)}
.pill.annule,.pill.refuse,.pill.absente{background:var(--surface-2);color:var(--text-sub)}
.pill.story{background:var(--clay-bg);color:var(--clay-fg)}
.pill.new{background:var(--sage-bg);color:var(--sage-fg)}
.hint{color:var(--muted);font-size:13.5px}
.group-title{margin:20px 0 8px;font-size:14px;font-weight:600;color:var(--text-sub)}
.soon{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:56px 24px;color:var(--text-sub)}
.soon .ill{width:60px;height:60px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.soon .ill svg{width:26px;height:26px}
.soon h2{font-size:21px}
.soon p{margin:0;max-width:340px}

/* ---------- Formulaires ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.field>label,.flabel{font-size:13.5px;font-weight:500;color:var(--text-sub)}
.field .help,.help{font-size:12.5px;color:var(--muted);margin-top:-2px}
.inp,input.inp,select.inp,textarea.inp{width:100%;min-height:46px;border:1px solid var(--line-3);border-radius:12px;background:var(--surface);padding:10px 12px;font-size:16px;color:var(--ink);-webkit-appearance:none;appearance:none;min-width:0}
select.inp{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
textarea.inp{min-height:76px;resize:vertical;line-height:1.4}
.inp:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px var(--line)}
.inp::placeholder{color:var(--muted)}
input[type=time].inp,input[type=date].inp{display:block;line-height:24px}
input[type=date].inp::-webkit-date-and-time-value,input[type=time].inp::-webkit-date-and-time-value{text-align:left}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.row4{grid-template-columns:1fr 1fr}}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.opt{min-height:52px;border-radius:12px;border:1px solid var(--line-3);background:var(--surface);padding:8px 12px;text-align:left;display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--ink)}
.opt small{font-size:12.5px;color:var(--muted);white-space:nowrap;margin-left:auto}
.opt.on{background:var(--inv-bg);color:var(--inv-fg);border-color:var(--inv-bg)}
.opt.on small{color:var(--inv-sub)}
.opt-g{margin:12px 0 6px;display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--text-sub)}
.opt-g svg{width:16px;height:16px;color:var(--sage)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line-3);background:var(--surface);display:inline-flex;align-items:center;gap:8px;font-size:14.5px;color:var(--ink)}
.chip small{font-size:12.5px;color:var(--muted)}
.chip.on{background:var(--inv-bg);color:var(--inv-fg);border-color:var(--inv-bg)}
.chip.on small{color:var(--inv-sub)}
.chip svg{width:15px;height:15px}
.slot{min-height:52px;padding:6px 14px;border-radius:12px;border:1px solid var(--line-3);background:var(--surface);display:inline-flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;min-width:92px}
.slot b{font-size:16px;font-weight:600;color:var(--ink)}
.slot small{font-size:12px;color:var(--muted)}
.slot.A{border-color:var(--sage-line);background:var(--sage-bg)}
.slot .ideal{font-size:11.5px;font-weight:600;color:var(--sage-fg)}
.slot.C small{color:var(--accent)}
.slot.on{background:var(--inv-bg);border-color:var(--inv-bg)}
.slot.on b,.slot.on small,.slot.on .ideal{color:var(--inv-fg)}
.free-row{display:flex;gap:10px;align-items:center;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--surface-2);flex-wrap:wrap}
.free-row .flabel{flex:1 1 auto}
.free-row input{width:150px;flex:none}
.free-row.on{box-shadow:0 0 0 2px var(--ink)}
.notice{padding:12px 14px;border-radius:12px;background:var(--surface-2);color:var(--text);font-size:14px;display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}
.notice svg{width:18px;height:18px;flex:none;margin-top:1px}
.notice.clay{background:var(--clay-bg);color:var(--clay-fg)}
.notice.sage{background:var(--sage-bg);color:var(--sage-fg)}
.errbox{padding:12px 14px;border-radius:12px;background:var(--err-bg);color:var(--err-fg);font-size:14px;margin:0 0 14px}
.errbox ul{margin:6px 0 0;padding-left:18px}
.errbox .btn{margin-top:10px}
.sw-help{margin:-4px 0 8px 56px}
.switch{position:relative;display:inline-flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;font-size:15px;color:var(--ink)}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch i{width:46px;height:28px;border-radius:999px;background:var(--line-3);position:relative;flex:none;transition:background .2s}
.switch i::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s var(--ease)}
.switch input:checked+i{background:var(--brand)}
.switch input:checked+i::after{transform:translateX(18px)}
.switch input:focus-visible+i{outline:2px solid var(--focus);outline-offset:2px}
.radio-card{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;border:1px solid var(--line-3);background:var(--surface);cursor:pointer;margin-bottom:8px}
.radio-card input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--ink);flex:none}
.radio-card b{display:block;font-weight:600;color:var(--ink)}
.radio-card span{font-size:13.5px;color:var(--text-sub)}
.radio-card.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}

/* ---------- Panneaux empilables ---------- */
#layers{position:relative;z-index:60}
.layer{position:fixed;inset:0;z-index:60}
.ly-back{position:absolute;inset:0;background:var(--backdrop);animation:fade .18s}
@keyframes fade{from{opacity:0}}
.ly-panel{position:absolute;left:0;right:0;top:0;bottom:0;background:var(--surface);display:flex;flex-direction:column;animation:up .22s var(--ease);padding-top:var(--safe-t)}
@keyframes up{from{transform:translateY(36px);opacity:.6}}
@media (min-width:700px){
  .ly-back{background:var(--backdrop-side)}
  .layer+.layer .ly-back{background:transparent}
  .ly-panel{left:auto;width:min(440px,100%);box-shadow:-12px 0 40px rgba(0,0,0,.16);animation:side .2s var(--ease);padding-top:0}
  .ly-panel.wide{width:min(760px,100%)}
  .ly-panel.full{width:100%}
  @keyframes side{from{transform:translateX(30px);opacity:.6}}
}
.ly-head{display:flex;align-items:center;gap:4px;padding:6px 6px 6px 16px;border-bottom:1px solid var(--line-2);min-height:56px;flex:none}
.ly-head h2{flex:1;font-size:18px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ly-head .icon-btn.back{margin-left:-10px}
.ly-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;flex:1;overscroll-behavior:contain;min-height:0}
.ly-foot{padding:12px 16px calc(12px + var(--safe-b));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;background:var(--surface);flex:none}
.ly-foot .sum{font-size:13.5px;color:var(--text-sub);text-align:center}
.foot-row{display:flex;gap:10px}
.foot-row .btn{flex:1}

/* Détail RDV */
.d-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
.d-head h3{font-size:24px;line-height:1.15}
.d-when{font-size:16px;color:var(--ink);margin-top:6px}
.d-when .mono{color:var(--text-sub)}
.dl{display:grid;grid-template-columns:110px 1fr;gap:10px 12px;margin:0 0 16px;font-size:14.5px;padding:14px;background:var(--surface-2);border-radius:12px}
.dl dt{color:var(--muted);font-size:13.5px}
.dl dd{margin:0;color:var(--ink);min-width:0;display:flex;align-items:center;gap:8px}
.segs{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.segline{display:flex;gap:10px;align-items:center;padding:10px 12px 10px 14px;border-radius:12px;font-size:14.5px;background:var(--cbg);color:var(--fg);box-shadow:inset 4px 0 0 var(--bd)}
.segline svg{width:20px;height:20px;flex:none;opacity:.8}
.segline .t{font-size:13px;color:var(--sub);margin-left:auto;white-space:nowrap}
.segline .w{font-weight:500}
.segline .w small{display:block;font-size:12.5px;font-weight:400;color:var(--sub)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 14px}
.acts .wide{grid-column:1/-1}
.danger-zone{border-top:1px solid var(--line);padding-top:12px;text-align:center}
.cli-link{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border-radius:12px;background:var(--surface-2);margin:0 0 14px;text-align:left;color:var(--ink);font-weight:500}
.cli-link span{flex:1}
.cli-link svg{width:18px;height:18px;color:var(--muted)}

/* Menu ajouter */
.nr-alt{margin-top:22px;padding-top:14px;border-top:1px dashed var(--line-3)}
.nr-alt-t{display:block;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.nr-alt .chip{font-size:13px;color:var(--text-sub)}
.nr-alt .chip svg{width:15px;height:15px;opacity:.75}
.add-choice{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:16px;border-radius:16px;background:var(--surface-2);margin-bottom:10px;min-height:76px}
.add-choice:hover{filter:brightness(.98)}
.add-choice .ic{width:48px;height:48px;border-radius:50%;background:var(--surface);display:grid;place-items:center;flex:none;color:var(--sage)}
.add-choice .ic svg{width:22px;height:22px}
.add-choice b{display:block;font-size:17px;color:var(--ink);font-weight:600}
.add-choice span{font-size:13.5px;color:var(--text-sub)}
.add-choice.clay .ic{color:var(--accent)}
.add-choice.ink .ic{color:var(--text)}

/* ---------- Nouveau rendez-vous ---------- */
.nr-sec{margin-bottom:20px}
.nr-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 8px}
.nr-h h3{font-size:16px}
.nr-h .hint{font-size:13px}
.nr-q{position:relative}
.nr-q svg.ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted);pointer-events:none}
.nr-q input{padding-left:44px;min-height:52px;font-size:17px}
.sugg{margin-top:6px;border-radius:14px;box-shadow:0 0 0 1px var(--line);background:var(--surface);overflow:hidden}
.sugg:empty{display:none}
.sg{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;min-height:56px;border-top:1px solid var(--line-2)}
.sg:first-child{border-top:0}
.sg:hover,.sg.hl{background:var(--hover)}
.sg .t{flex:1;min-width:0}
.sg b{display:block;font-weight:600;color:var(--ink);font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg small{display:block;font-size:13px;color:var(--text-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg.new .pdot{background:var(--surface-2);color:var(--ink)}
.sg.new .pdot svg{width:14px;height:14px}
.sg-empty{padding:12px 14px;font-size:13.5px;color:var(--muted)}
.cli-card{display:flex;gap:12px;align-items:flex-start;padding:12px 12px 12px 14px;border-radius:14px;background:var(--surface-2);box-shadow:inset 4px 0 0 var(--pc,var(--line-3))}
.cli-card .t{flex:1;min-width:0}
.cli-card b{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:600;color:var(--ink);flex-wrap:wrap}
.cli-card small{display:block;font-size:13.5px;color:var(--text-sub);margin-top:2px}
.cli-card .acts2{display:flex;flex-direction:column;align-items:flex-end;gap:2px;margin:-6px -4px 0 0}
.cli-card .link-btn{min-height:36px;font-size:14px}
.cli-warn{margin-top:8px;font-size:13.5px;color:var(--clay-fg);display:flex;gap:6px;align-items:center}
.cli-warn svg{width:16px;height:16px;flex:none}
.svc-g{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}
.svc-g>span{flex:none;width:52px;padding-top:12px;font-size:13px;font-weight:500;color:var(--text-sub);display:flex;align-items:center;gap:4px}
.svc-g>span svg{width:15px;height:15px}
.svc-g .chips{flex:1;gap:6px}
.svc-g .chip{min-height:42px;padding:0 12px;font-size:14px;gap:6px}
.recos{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.rcard{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:10px 12px 10px 14px;border-radius:14px;background:var(--surface);box-shadow:inset 4px 0 0 var(--pc),0 0 0 1px var(--line);min-height:112px;min-width:0}
.rcard:hover{box-shadow:inset 4px 0 0 var(--pc),0 0 0 1px var(--line-3)}
.rcard.on{box-shadow:inset 4px 0 0 var(--pc),0 0 0 2px var(--ink)}
.rcard .rd{font-size:13.5px;font-weight:500;color:var(--text-sub);display:flex;flex-wrap:wrap;column-gap:6px;width:100%;align-items:baseline}
.rcard .rd .rdd{white-space:nowrap}
.rcard .rd .rel{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.rcard .rh{font-size:19px;font-weight:600;color:var(--ink);line-height:1.15}
.rcard .rp{font-size:13px;color:var(--text);display:flex;align-items:center;gap:6px}
.rcard .rr{display:flex;flex-direction:column;gap:2px;margin-top:2px}
.rcard .rr span{font-size:12px;color:var(--sage-fg);display:flex;gap:4px;align-items:center;line-height:1.2}
.rcard .rr svg{width:12px;height:12px;flex:none}
.rcard .badge{position:absolute;top:-8px;right:8px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent);color:var(--accent-text)}
.rcard .ok{position:absolute;right:10px;bottom:10px;width:22px;height:22px;border-radius:50%;background:var(--inv-bg);color:var(--inv-fg);display:grid;place-items:center}
.rcard .ok svg{width:14px;height:14px}
.recos-first{padding-top:6px}
.other-btn{display:flex;align-items:center;gap:8px;width:100%;min-height:48px;padding:0 14px;border-radius:12px;background:var(--surface-2);color:var(--ink);font-weight:500;margin-top:12px}
.other-btn span{flex:1;text-align:left}
.other-btn svg{width:18px;height:18px;transition:transform .2s}
.other-btn[aria-expanded="true"] svg.chev{transform:rotate(180deg)}
.other{padding:12px 0 0}
.gp-h{display:flex;align-items:center;gap:8px;margin:14px 0 8px;font-size:14px;font-weight:600;color:var(--ink)}
.nr-alt{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13.5px;color:var(--text-sub);border-top:1px solid var(--line);padding-top:14px;margin-top:6px}
.nr-alt .chip{min-height:38px;font-size:14px}

/* ---------- Recherche globale ---------- */
#gsearch{position:fixed;left:0;right:0;top:0;z-index:30;background:var(--surface);padding:calc(8px + var(--safe-t)) 8px 8px 12px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
body.has-demo #gsearch{padding-top:8px}
@media (min-width:700px){#gsearch{left:auto;right:16px;top:calc(10px + var(--safe-t));width:min(560px,calc(100% - 32px));border-radius:16px;border:1px solid var(--line);box-shadow:var(--shadow);padding:6px 6px 6px 12px}}
#gsearch .gs-in{position:relative;flex:1;min-width:0}
#gsearch .gs-in svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:19px;height:19px;color:var(--muted);pointer-events:none}
#gsearch input{width:100%;min-height:44px;border-radius:999px;border:1px solid var(--line-3);background:var(--bg);padding:0 14px 0 40px;-webkit-appearance:none;appearance:none;color:var(--ink)}
#gsearch input:focus{outline:none;border-color:var(--ink)}
#gsearch input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
#gs-res{position:absolute;left:8px;right:8px;top:calc(100% + 6px);max-height:min(70vh,560px);overflow-y:auto;background:var(--surface);border-radius:16px;box-shadow:var(--shadow),0 0 0 1px var(--line);padding:6px 0}
#gs-res:empty{display:none}
#gs-res .gs-t{padding:8px 14px 4px;font-size:12.5px;font-weight:600;color:var(--muted)}
#gs-res .gs-i{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:8px 14px;min-height:52px}
#gs-res .gs-i:hover,#gs-res .gs-i.hl{background:var(--hover)}
#gs-res .gs-i .t{flex:1;min-width:0}
#gs-res .gs-i b{display:block;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gs-res .gs-i small{display:block;font-size:13px;color:var(--text-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gs-res .gs-none{padding:10px 14px;font-size:13.5px;color:var(--muted)}
.gs-date{flex:none;width:44px;text-align:center;line-height:1.05}
.gs-date .d1{font-size:11.5px;color:var(--text-sub)}
.gs-date .d2{font-size:19px;font-weight:600;color:var(--ink)}

/* ---------- Menu Filtres ---------- */
#filt-pop{position:fixed;z-index:45;width:min(330px,calc(100vw - 24px));background:var(--surface);border-radius:16px;box-shadow:var(--shadow),0 0 0 1px var(--line);padding:8px 14px 10px}
#filt-pop h4{font-size:14px;color:var(--text-sub);font-weight:600;margin:6px 0 2px}
#filt-pop .switch{width:100%;justify-content:space-between;flex-direction:row-reverse;font-size:15px}
#filt-pop .help{display:block;margin:-6px 0 6px 0}

/* ---------- Réglages ---------- */
.set-wrap{display:grid;gap:20px}
@media (min-width:700px){.set-wrap{grid-template-columns:250px minmax(0,1fr);align-items:start}.set-nav{position:sticky;top:16px}}
@media (min-width:1100px){.set-wrap{grid-template-columns:280px minmax(0,1fr)}}
.set-g{font-size:13px;font-weight:600;color:var(--muted);margin:16px 4px 6px}
.set-g:first-child{margin-top:0}
.set-list{background:var(--surface);border-radius:var(--radius);box-shadow:0 0 0 1px var(--line);overflow:hidden}
.set-it{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;min-height:54px;border-top:1px solid var(--line-2)}
.set-it:first-child{border-top:0}
.set-it:hover{background:var(--hover)}
.set-it.on{background:var(--surface-2)}
.set-it .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);color:var(--text);flex:none}
.set-it.on .ic{background:var(--inv-bg);color:var(--inv-fg)}
.set-it .ic svg{width:18px;height:18px}
.set-it .t{flex:1;min-width:0}
.set-it b{display:block;font-weight:500;color:var(--ink)}
.set-it small{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set-it>svg{width:18px;height:18px;color:var(--muted);flex:none}
@media (min-width:700px){.set-it>svg{display:none}}
.set-back{display:inline-flex;align-items:center;gap:4px;min-height:44px;margin:0 0 4px -8px;padding:0 8px;color:var(--ink);font-weight:500;border-radius:999px}
.set-back svg{width:20px;height:20px}
.set-title{font-size:26px;margin:0 0 4px}
.set-lead{color:var(--text-sub);font-size:14px;margin:0 0 16px}
.card-s{background:var(--surface);border-radius:var(--radius);box-shadow:0 0 0 1px var(--line);padding:14px 16px;margin-bottom:12px}
.card-s h3{font-size:17px;margin-bottom:4px}
.card-s .lead{color:var(--text-sub);font-size:14px;margin:0 0 12px}
.dayrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dayrow h4{margin:0;font-weight:600;font-size:16px;color:var(--ink)}
.dayrow+.row4{margin-top:10px}
.savebar{position:sticky;bottom:calc(var(--tab-h) + 10px);z-index:15;margin-top:14px;background:var(--inv-bg);color:var(--inv-fg);border-radius:18px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.savebar span{flex:1;font-size:14px}
.savebar .btn-ghost{background:transparent;color:var(--inv-fg);border-color:var(--inv-sub)}
.savebar .btn-accent{min-width:120px}
.bl-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line-2)}
.bl-item:first-child{border-top:0}
.bl-item .bi{flex:1;min-width:0}
.bl-item b{display:flex;align-items:center;gap:6px;color:var(--ink);font-weight:600}
.bl-item span{font-size:13.5px;color:var(--text-sub)}
.of-item{flex-wrap:wrap}
.of-item .bi{flex:1 1 100%}
.of-item .bi span{display:block}
.of-item .inp{margin-top:6px;font-size:13.5px;min-height:40px}
.of-acts{display:flex;gap:8px;flex-wrap:wrap}
.ph-row{display:flex;align-items:center;gap:14px;margin:12px 0 4px;flex-wrap:wrap}
.ph-img{width:76px;height:76px;border-radius:50%;object-fit:cover;flex:none;background:var(--surface-2);box-shadow:0 0 0 3px var(--surface),0 0 0 4px var(--pc,var(--line-3))}
.ph-mono{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:28px;font-weight:600;flex:none;background:var(--pc);color:var(--fc);box-shadow:0 0 0 3px var(--surface),0 0 0 4px var(--pc)}
.ph-acts{display:flex;gap:8px;flex-wrap:wrap}
.ph-file{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.theme-opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.theme-o{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 8px;border-radius:14px;border:1px solid var(--line-3);background:var(--surface);font-weight:500;color:var(--ink)}
.theme-o.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.theme-o i{width:100%;max-width:92px;height:54px;border-radius:9px;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.theme-o i.l{background:linear-gradient(180deg,#FBF7EE 0 34%,#F5EFE3 34%)}
.theme-o i.d{background:linear-gradient(180deg,#1D2018 0 34%,#14160F 34%)}
.theme-o i.a{background:linear-gradient(90deg,#F5EFE3 0 50%,#14160F 50%)}
.col-prev{position:relative;z-index:10;background:var(--surface);border-radius:var(--radius);box-shadow:0 0 0 1px var(--line),var(--shadow);padding:12px;margin-bottom:12px}
@media (min-width:700px){.col-prev{position:sticky;top:calc(10px + var(--safe-t))}}
.col-prev .pv-t{font-size:13px;font-weight:600;color:var(--text-sub);margin-bottom:8px}
.pv-tl{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pv-col{position:relative;height:126px}
.pv-col .evc{left:0;right:0}
.pv-mass{position:relative;height:40px;margin-top:8px}
.col-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line-2)}
.col-row:first-of-type{border-top:0}
.col-row .cn{flex:1 1 140px;min-width:0;font-weight:500;color:var(--ink)}
.cpick{width:48px;height:38px;border:1px solid var(--line-3);border-radius:10px;padding:3px;background:var(--surface);cursor:pointer;flex:none}
.cpick::-webkit-color-swatch-wrapper{padding:0}
.cpick::-webkit-color-swatch{border:0;border-radius:7px}
.cpick::-moz-color-swatch{border:0;border-radius:7px}
.swatches{display:flex;flex-wrap:wrap;gap:7px;flex-basis:100%}
.sw{width:30px;height:30px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.sw.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}

/* Dialogue / toasts */
#dialog{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:var(--backdrop)}
#dialog:empty{display:none}
.dlg{background:var(--surface);border-radius:20px;padding:22px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.dlg h3{font-size:20px;margin-bottom:8px}
.dlg p{color:var(--text-sub);margin:0 0 18px;white-space:pre-line}
.dlg .foot-row{flex-direction:row-reverse}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + 86px);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(440px,calc(100% - 32px));pointer-events:none}
@media (min-width:1000px){#toasts{bottom:24px;left:calc(50% + var(--nav-w)/2)}}
.toast{pointer-events:auto;background:var(--inv-bg);color:var(--inv-fg);border-radius:14px;padding:12px 14px 12px 16px;font-size:14.5px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.28);width:100%;animation:up .2s var(--ease)}
.toast span{flex:1}
.toast.err{background:var(--danger);color:var(--surface)}
.toast.ok::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--sage);flex:none}
.toast button{color:inherit;font-weight:600;min-height:36px;padding:0 6px;text-decoration:underline;text-underline-offset:3px}
#ptr{position:fixed;top:calc(var(--safe-t) + 8px);left:calc(50% + var(--nav-w)/2);transform:translate(-50%,-80px);z-index:30;background:var(--inv-bg);color:var(--inv-fg);padding:8px 14px;border-radius:999px;font-size:13px;display:flex;gap:8px;align-items:center;transition:transform .15s}
#ptr svg{width:16px;height:16px}
.mod-host{display:block;width:100%;min-width:0;max-width:100%}
#stats-host{width:100%;min-width:0}
.c-st{font-style:normal;display:inline-block;margin-left:6px;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:999px;background:var(--inv-bg);color:var(--inv-fg);vertical-align:1px}
</style>
</head>
<body>
<div id="demo-strip" hidden>Mode démo · données fictives</div>
<div id="ptr" aria-hidden="true"></div>

<div id="login" hidden></div>

<div id="app" hidden>
  <nav id="nav" aria-label="Navigation principale"></nav>
  <main id="main">
    <section id="v-planning">
      <div id="ph" class="plan-head"></div>
      <div id="pc"></div>
      <div id="stats-host" hidden></div>
    </section>
    <section id="v-clientes" hidden></section>
    <section id="v-attente" hidden></section>
    <section id="v-reglages" hidden></section>
  </main>
  <button id="fab" data-act="add" aria-label="Nouveau rendez-vous"></button>
  <button id="fill-fab" data-act="magie" hidden></button>
  <div id="gsearch" hidden></div>
  <div id="filt-pop" hidden></div>
</div>

<div id="layers"></div>
<div id="dialog"></div>
<div id="toasts" role="status" aria-live="polite"></div>

<script src="../app/config.js"></script>
<script src="../app/core.js?v=1.3.1"></script>
<script src="../app/api.js?v=1.3.1"></script>

  if (action) el.querySelector('button').onclick = function () { el.remove(); action.fn(); };

      '<button class="btn btn-ghost" data-r="0">' + esc(o.cancel || 'Retour') + '</button></div></div>';

/* ================= Panneaux empilables =================
   Une « vue » shell : { title, render(), footer?(), mount?(body), on?(act, el, ev), onInput?(el, ev), size?, onClose? }
   Une vue « child » est une sous-étape (bouton Retour) ; X ferme la vue racine et ses sous-étapes. */
var stack = [];
function topView() { return stack[stack.length - 1]; }
function lockScroll() { document.body.style.overflow = stack.length ? 'hidden' : ''; }
function openSheet(v, child) {
  v.child = !!child && stack.length > 0;
  var L = document.createElement('div');
  L.className = 'layer';
  L.innerHTML = '<div class="ly-back" data-ly="close"></div><section class="ly-panel ' + (v.size || 'side') + '" role="dialog" aria-modal="true">' +
    '<header class="ly-head">' + (v.child ? '<button class="icon-btn back" data-ly="back" aria-label="Retour">' + I.chevronL + '</button>' : '') +
    '<h2></h2><button class="icon-btn" data-ly="close" aria-label="Fermer">' + I.x + '</button></header>' +
    '<div class="ly-body"></div><footer class="ly-foot" hidden></footer></section>';
  v.layer = L; L._view = v;
  $('#layers').appendChild(L);
  stack.push(v);
  lockScroll();
  if (v.raw) {
    L.querySelector('h2').textContent = v.title || '';
    var body = L.querySelector('.ly-body');
    if (typeof v.content === 'string') body.innerHTML = v.content; else if (v.content) body.appendChild(v.content);
  } else paint(v, true);
  return v;
}
function removeLayer(v) {
  var i = stack.indexOf(v); if (i < 0) return;
  stack.splice(i, 1);
  if (v.layer) v.layer.remove();
  v.closed = true;
  if (v.onClose) { try { v.onClose(); } catch (e) { console.error(e); } }
}
/** Ferme v et tout ce qui est au-dessus. */
function closeFrom(v) {
  var i = stack.indexOf(v); if (i < 0) return;
  for (var k = stack.length - 1; k >= i; k--) removeLayer(stack[k]);
  lockScroll();
}
/** Ferme la vue v (ou la vue du dessus) avec ses étapes parentes « child ». */
function closeGroup(v) {
  v = v || topView(); var i = stack.indexOf(v); if (i < 0) return;
  while (i > 0 && stack[i].child) i--;
  closeFrom(stack[i]);
}
function closeSheet(all) { if (!stack.length) return; if (all) closeGroup(topView()); else closeFrom(topView()); }
function closeAll() { if (stack.length) closeFrom(stack[0]); }
function paint(v, first) {
  if (!v || !v.layer || v.closed || v.raw) return;
  var body = v.layer.querySelector('.ly-body'), foot = v.layer.querySelector('.ly-foot');
  var sc = first ? 0 : body.scrollTop;
  // Conserver la saisie en cours (le champ focalisé est recréé par le rendu)
  var ae = document.activeElement, fid = ae && ae.id && body.contains(ae) ? ae.id : null, sel = null;
  if (fid) { try { sel = [ae.selectionStart, ae.selectionEnd]; } catch (e) { sel = null; } }
  body.innerHTML = v.render();
  v.layer.querySelector('h2').textContent = v.title || '';
  v.layer.querySelector('.ly-panel').setAttribute('aria-label', v.title || '');
  var f = v.footer ? v.footer() : '';
  foot.innerHTML = f; foot.hidden = !f;
  body.scrollTop = sc;
  if (fid) {
    var nf = body.querySelector('#' + fid);
    if (nf && nf !== document.activeElement) { try { nf.focus({ preventScroll: true }); if (sel && sel[0] != null) nf.setSelectionRange(sel[0], sel[1]); } catch (e) { /* ignore */ } }
  }
  if (v.mount) v.mount(body);
}
function repaint(v) { paint(v || topView()); }
function updFoot(v) { if (!v || !v.layer || !v.footer) return; var f = v.layer.querySelector('.ly-foot'); var h = v.footer(); f.innerHTML = h; f.hidden = !h; }
function bodyOf(v) { return v && v.layer ? v.layer.querySelector('.ly-body') : null; }
/** G.panel : panneau pour les modules (contenu libre). */
function openPanel(o) {
  var v = { raw: true, title: o.title || '', size: ['side', 'wide', 'full'].indexOf(o.size) >= 0 ? o.size : 'side', content: o.content, onClose: o.onClose };

}

var pin = '', pinErr = '', pinBusy = false;
function showLogin() {
  $('#app').hidden = true; $('#login').hidden = false;

}
function renderLogin(shake) {
  var dots = '';
  for (var i = 0; i < Math.max(4, pin.length); i++) dots += '<i class="' + (i < pin.length ? 'on' : '') + '"></i>';
  var keys = '';
  ['1', '2', '3', '4', '5', '6', '7', '8', '9'].forEach(function (k) { keys += '<button type="button" data-act="pin" data-k="' + k + '" aria-label="' + k + '">' + k + '</button>'; });
  keys += '<button type="button" class="ghost" data-act="pin" data-k="clear">Effacer</button><button type="button" data-act="pin" data-k="0">0</button>' +
    '<button type="button" class="ghost" data-act="pin" data-k="del" aria-label="Supprimer un chiffre">' + I.back + '</button>';
  $('#login').innerHTML = '<div class="login-box"><img class="login-logo" src="../assets/logo-600.jpg" alt="" width="176" height="176"><h1>Sorelle Bien-Être</h1>' +
    '<p class="pbar">Planning des praticiennes. Entrez votre code.</p>' +
    '<div class="pin-dots' + (shake ? ' shake' : '') + '" aria-label="' + pin.length + ' chiffres saisis">' + dots + '</div>' +
    '<div class="pin-err" role="alert">' + esc(pinErr) + '</div>' +
    '<div class="pin-pad">' + keys + '</div>' +
    '<button type="button" class="btn btn-ink" data-act="pin" data-k="ok"' + (pin.length < 4 || pinBusy ? ' disabled' : '') + '>' + (pinBusy ? 'Connexion…' : 'Valider') + '</button>' +
    (API.isDemo ? '<div class="demo-hint">PIN démo : 0000</div>' : '') + '</div>';
}
function pinKey(k) {
  if (pinBusy) return;
  if (k === 'del') pin = pin.slice(0, -1);
  else if (k === 'clear') pin = '';
  else if (k === 'ok') return submitPin();
  else if (/^\d$/.test(k) && pin.length < 8) pin += k;
  pinErr = ''; renderLogin();
}
function submitPin() {
  if (pin.length < 4) return;
  pinBusy = true; renderLogin();
  API.login(pin).then(function () { pinBusy = false; pin = ''; startApp(); }, function (e) {
    pinBusy = false; pin = ''; pinErr = e.message; renderLogin(true);
  });
}

      if (!fit) { var m = svcMap(); fit = w.prestations.slice().sort(function (a, c) { return ((m[c.service] || {}).duree || 0) - ((m[a.service] || {}).duree || 0); })[0]; }
      var label = fit ? abbr(fit.service) + ' possible' : '';
      html += '<button type="button" class="freez' + (hgt < 40 ? ' tiny' : '') + '" style="--pc:' + pc + ';top:' + (y(s) + 2) + 'px;height:' + hgt + 'px" data-act="freez" data-prat="' + p.id + '" data-debut="' + (fit ? fit.debut : w.debut) + '" aria-label="Libre de ' + hfr2(w.debut) + ' à ' + hfr2(w.fin) + ' avec ' + esc(p.nom) + ', ajouter une cliente">' +

    });
    var items = rdvs.filter(function (r) { return r.type !== 'massage' && r.praticienne === p.id; }).map(function (r) {
      var s = U.toMin(r.debut), e = U.toMin(r.fin);
      return { r: r, s: s, e: e + (ACTIVE[r.statut] ? b : 0), end: e };
    });
    layoutLanes(items);
    items.forEach(function (it) {
      var r = it.r, top = y(it.s), hgt = Math.max((it.end - it.s) * ppm - 2, 20);
      var w = 100 / it.lanes, l = it.lane * w;

      }).join('');
      var tiny = hgt < 50;
      html += '<div class="evc st-' + r.statut + (tiny ? ' tiny' : '') + '" role="button" tabindex="0" data-act="rdv" data-id="' + esc(r.id) + '" style="' + cardVars(r) + pos + 'top:' + top + 'px;height:' + hgt + 'px" aria-label="' + esc(fullName(r) + ', ' + hfr(r.debut) + ', ' + pratName(r.praticienne)) + '">' + segs +
        '<span class="c-time">' + hplage(r.debut, r.fin) + (r.source === 'story' ? '<i class="c-st">Story</i>' : '') + '</span><span class="c-name">' + esc(dense ? shortName(r) : fullName(r)) + '</span>' +
        '<span class="c-svc">' + esc(r.services.map(abbr).join(' + ')) + '</span>' + (r.statut === 'en_attente' ? '<span class="c-wait">À valider</span>' : '') + '</div>';
      if (ACTIVE[r.statut] && b) html += '<div class="buffer" style="' + pos + 'top:' + (y(it.end)) + 'px;height:' + b * ppm + 'px"></div>';
    });
    return '<div class="tl-col' + (p.active === false ? ' inactive' : '') + '" data-act="slot" data-prat="' + p.id + '">' + html + '</div>';
  }).join('');

  var massages = rdvs.filter(function (r) { return r.type === 'massage'; }).map(function (r) {
    var s = U.toMin(r.debut), e = U.toMin(r.fin), hgt = Math.max((e - s) * ppm - 2, 24);
    var who = fullName(r);
    return '<div class="mcard st-' + r.statut + '" role="button" tabindex="0" data-act="rdv" data-id="' + esc(r.id) + '" style="' + massVars(r) + 'top:' + y(s) + 'px;height:' + hgt + 'px">' +
      '<span class="m-title">' + I.leaf + esc(svcName(r.services[0])) + (dense ? '' : ' · institut bloqué') + '</span>' +
      '<span class="m-sub">' + hplage(r.debut, r.fin) + ' · ' + esc(pratName(r.praticienne)) + (who ? ' · ' + esc(who) : '') + (r.statut === 'en_attente' ? ' · à valider' : '') + '</span></div>' +
      (ACTIVE[r.statut] && b ? '<div class="mbuffer" style="top:' + y(e) + 'px;height:' + b * ppm + 'px"></div>' : '');
  }).join('');

  var now = '';
  if (d === today()) { var nm = nowMin(); if (nm > t0 && nm < t1) now = '<div class="now" style="top:' + y(nm) + 'px"><span>' + hfr2(U.toHHMM(nm)) + '</span></div>'; }
  var grid = 'background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px ' + 60 * ppm + 'px),repeating-linear-gradient(to bottom,transparent 0 ' + 30 * ppm + 'px,var(--line-2) ' + 30 * ppm + 'px ' + (30 * ppm + 1) + 'px,transparent ' + (30 * ppm + 1) + 'px ' + 60 * ppm + 'px)';

  return (!rules ? '<div class="closed-banner">Jour normalement fermé : rendez-vous ajoutés manuellement.</div>' : '') +
    '<div class="tl" style="grid-template-columns:52px 1fr;height:' + H + 'px">' +
    '<div class="tl-gutter">' + gutter + '</div>' +
    '<div class="tl-cols" style="grid-template-columns:repeat(' + cols.length + ',minmax(0,1fr))"><div class="tl-grid" style="' + grid + '"></div>' + colsHtml +
    '<div class="massage-layer">' + massages + '</div>' + now + '</div></div><div style="height:30px"></div>';
}

function renderWeek(mon) {
  var ps = visiblePrats(), out = '', max = S.cfg.maxClientesJour, colsT = [];
  for (var i = 0; i < 7; i++) {
    var d = U.addDays(mon, i), jr = S.data.jours[d] || {}, rules = U.dayRules(S.cfg, d);
    var all = S.data.rdvs.filter(function (r) { return r.date === d && (G.filtre.annules || ACTIVE[r.statut]); }).sort(function (a, b) { return a.debut.localeCompare(b.debut); });
    var bls = S.data.blocages.filter(function (x) { return x.du <= d && x.au >= d; });
    var closed = !rules && !all.length;
    colsT.push(closed ? 'minmax(0,.45fr)' : 'minmax(0,1fr)');
    if (closed && S.skipClosed && narrow()) continue;
    var inner;
    if (closed) inner = '<div class="wk-closed">Fermé</div>';
    else {
      inner = '<div class="wk-cols" style="--n:' + ps.length + '">' + ps.map(function (p) {
        var list = all.filter(function (r) { return r.praticienne === p.id || r.type === 'massage'; });
        var cnt = dayCount(d, p.id), pc = pColor(p.id), cp = capacityOf(d, p.id);
        var items = S.showBlocks ? bls.filter(function (x) { return x.praticienne === 'tous' || x.praticienne === p.id; }).map(function (x) {
          var l = blocLabel(x); return '<div class="wk-item bloc"><b>' + esc(l.heures === 'Journée' ? 'Jour' : l.heures.replace(/ \(.*\)/, '')) + '</b><span>' + esc(x.motif || 'Indispo') + '</span></div>';
        }).join('') : '';
        items += list.map(function (r) {
          var cls = r.type === 'massage' ? 'mass' : r.statut === 'en_attente' ? 'wait' : ACTIVE[r.statut] ? '' : 'cancel';
          if (r.type === 'massage' && !ACTIVE[r.statut]) cls += ' cancel';
          return '<div class="wk-item ' + cls + '" style="' + (r.type === 'massage' ? massVars(r) : cardVars(r)) + '"><b>' + hplage(r.debut, r.fin) + '</b><span>' + esc(r.type === 'massage' ? 'Modelage' + (r.praticienne === p.id ? '' : ' (' + pratName(r.praticienne) + ')') : shortName(r)) + '</span></div>';
        }).join('');
        var pl = cp == null ? '' : cnt >= max ? '<span class="pl none">complet</span>' : '<span class="pl' + (cp ? '' : ' none') + '">' + cp + ' place' + (cp > 1 ? 's' : '') + '</span>';
        return '<div class="wk-col"><h4>' + pdot(p.id, 'md') + '<span class="nm">' + esc(p.nom) + '</span></h4>' +
          '<div class="wk-g">' + gbar(cnt, max, pc) + '<span>' + cnt + '/' + max + '</span>' + pl + '</div>' + (items || '<div class="wk-none">Libre</div>') + '</div>';
      }).join('') + '</div>';
    }
    out += '<button class="wk-day' + (closed ? ' closed' : '') + (d === today() ? ' is-today' : '') + '" data-act="goday" data-date="' + d + '">' +
      '<div class="wk-date"><div class="d1">' + esc(cap(wdShort(d))) + '</div><div class="d2">' + (+d.slice(8)) + (showMois() ? '<small>' + esc(F_MON.format(dObj(d))) + '</small>' : '') + '</div><div class="d3">' + (rules ? hfr(U.toHHMM(rules.debut)) + '–' + hfr(U.toHHMM(rules.fin)) + (jr.exception ? ' · except.' : '') : 'Fermé') + '</div></div>' + inner + '</button>';
  }
  return '<div class="week" style="--wcols:' + colsT.join(' ') + '">' + out + '</div><div style="height:30px"></div>';
}

function renderMonth() {
  var d = S.date, first = monthFirst(d), last = monthLast(d), gs = monday(first), ge = U.addDays(monday(last), 6);
  var ps = visiblePrats().filter(function (p) { return p.active !== false; }), max = S.cfg.maxClientesJour, t = today(), nar = narrow();
  var svcLbl = defaultSvcList().map(function (s) { return s.nom; }).join(' + ') || 'la prestation par défaut';
  var cells = '';
  for (var x = gs; x <= ge; x = U.addDays(x, 1)) {
    var rules = U.dayRules(S.cfg, x), out = x < first || x > last, has = dayHasActive(x);
    var cls = 'mo-cell' + (out ? ' out' : '') + (!rules && !has ? ' closed' : '') + (x < t ? ' past' : '') + (x === t ? ' today' : '');
    var wait = S.data.rdvs.some(function (r) { return r.date === x && r.statut === 'en_attente'; });
    var inner = '';
    if (!rules && !has) inner = '<span class="mo-closed">Fermé</span>';
    else if (S.holes) {
      if (x < t) inner = ps.map(function (p) { var n = dayCount(x, p.id); return '<span class="mo-l"><i class="pdot sm" style="--c:' + pColor(p.id) + '"></i><span class="nm">' + esc(p.nom) + '</span><b>' + n + '/' + max + '</b></span>'; }).join('');
      else inner = ps.map(function (p) {
        var c = rules ? capacityOf(x, p.id) : 0, pc = pColor(p.id);
        if (!c) return '<span class="mo-t zero"><span class="nm">' + esc(p.nom) + '</span>' + (dayCount(x, p.id) >= max ? 'Complet' : '0') + '</span>';
        return '<span class="mo-t" style="--tbg:' + tint(pc, 0.5) + ';--tfg:' + textOn(tint(pc, 0.5)) + '"><span class="nm">' + esc(p.nom) + '</span>' + c + '</span>';
      }).join('');
    } else inner = ps.map(function (p) {
      var n = dayCount(x, p.id), pc = pColor(p.id);
      return '<span class="mo-l"><span class="nm">' + esc(p.nom) + '</span>' + gbar(n, max, pc) + '<b>' + n + (nar ? '' : '/' + max) + '</b></span>';
    }).join('');
    var lbl = dateLong(x) + (rules ? '' : ', fermé');
    cells += '<button class="' + cls + '" data-act="goday" data-date="' + x + '" aria-label="' + esc(lbl) + '"><span class="mo-num">' + (+x.slice(8)) + (wait ? '<i class="w" title="À valider"></i>' : '') + '</span>' + inner + '</button>';
  }
  var wd = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'].map(function (n) { return '<span>' + n + '</span>'; }).join('');
  var legend = S.holes
    ? '<div class="mo-legend"><span>Nombre de clientes « ' + esc(svcLbl) + ' » qui rentrent encore, par praticienne.</span></div>'
    : '<div class="mo-legend">' + ps.map(function (p) { return '<span>' + pdot(p.id, 'sm') + esc(p.nom) + '</span>'; }).join('') + '<span>Jauge : clientes prévues / ' + max + ' max par jour</span></div>';
  return '<div class="mo-wrap"><div class="mo-bar"><label class="switch"><input type="checkbox" data-pref="holes"' + (S.holes ? ' checked' : '') + '><i></i>Vue d\'ensemble des trous</label>' +
    '<span class="hint">' + (S.holes ? 'Places restantes calculées pour ' + esc(svcLbl) + '.' : 'Touchez un jour pour l\'ouvrir.') + '</span></div></div>' +
    '<div class="mo-wd">' + wd + '</div><div class="mo-wrap" style="padding-top:0"><div class="mo-grid">' + cells + '</div>' + legend + '</div><div style="height:30px"></div>';
}

/* ================= Détail RDV ================= */
function findRdv(id) { return S.cache[id] || (S.data && S.data.rdvs.filter(function (r) { return r.id === id; })[0]); }
function openRdv(id) {
  if (findRdv(id)) { openSheet(rdvView(id)); return; }
  // RDV hors de la plage chargée : on le cherche par l'historique
  G.historique().then(function (list) {
    var r = list.filter(function (x) { return x.id === id; })[0];
    if (!r) { toast('Ce rendez-vous est introuvable.', 'err'); return; }
    S.cache[id] = r; openSheet(rdvView(id));
    // compléter les segments (détail mains / pieds)
    A('admin.planning', { du: r.date, au: r.date }).then(function (d) { cacheRdvs(d.rdvs); stack.forEach(function (v) { if (v.id === id) repaint(v); }); }, function () { /* ignore */ });
  }, fail);
}
function rdvView(id) {
  var v = { title: 'Rendez-vous', id: id, note: null };
  v.render = function () {
    var r = findRdv(id);
    if (!r) return '<div class="vide"><p>Ce rendez-vous n\'existe plus.</p></div>';
    v.title = r.type === 'massage' ? 'Modelage' : 'Rendez-vous';
    var active = !!ACTIVE[r.statut];
    var segs = r.type === 'massage'
      ? '<div class="segline" style="' + massVars(r) + '">' + I.leaf + '<div class="w">' + esc(svcName(r.services[0])) + '<small>En cabine · tout l\'institut est bloqué</small></div><span class="t">' + hplage(r.debut, r.fin) + '</span></div>'
      : (r.segments && r.segments.length ? r.segments : r.services.map(function (s) { return { service: s, debut: '', fin: '', lieu: (svcMap()[s] || {}).categorie === 'pied' ? 'cabine' : 'poste' }; })).map(function (sg) {
        var cab = sg.lieu === 'cabine';
        return '<div class="segline" style="' + segVars(sg.service, r.praticienne) + '">' + (cab ? I.foot : I.hand) + '<div class="w">' + esc(svcName(sg.service)) + '<small>' + (cab ? 'Pieds · en cabine' : 'Mains · au poste') + '</small></div><span class="t">' + (sg.debut ? hplage(sg.debut, sg.fin) : '') + '</span></div>';
      }).join('');
    var dl = '<dt>Praticienne</dt><dd>' + pdot(r.praticienne, 'md') + esc(pratName(r.praticienne)) + '</dd>';
    dl += '<dt>Source</dt><dd>' + (r.source === 'story' ? '<span class="pill story">Story</span>Lien de la story' : r.source === 'en_ligne' ? 'Réservé en ligne' : r.source === 'agenda' ? 'Importé de l\'agenda' : 'Ajouté au salon') + '</dd>';
    if (r.nouvelle) dl += '<dt>Cliente</dt><dd><span class="pill new">Nouvelle cliente</span>' + (r.ongles ? esc({ rien: 'ongles naturels', gel: 'gel', semi: 'semi-permanent', porcelaine: 'porcelaine' }[r.ongles] || '') : '') + '</dd>';
    dl += '<dt>Code</dt><dd class="mono">' + esc(r.code) + '</dd>';
    var note = v.note != null ? v.note : (r.note || '');
    var acts = '';
    if (r.statut === 'en_attente') acts += '<button class="btn btn-sage" data-act="st" data-v="confirme">' + I.check + 'Valider</button><button class="btn btn-ghost" data-act="st" data-v="refuse">Refuser</button>';
    if (active) {
      acts += '<button class="btn btn-ghost" data-act="move">Déplacer</button><button class="btn btn-ghost" data-act="edit-svc">' + (r.type === 'massage' ? 'Changer de modelage' : 'Modifier prestations') + '</button>';
      acts += '<button class="btn btn-ghost" data-act="st" data-v="annule">Annuler le RDV</button>';
      if (r.type !== 'massage') acts += '<button class="btn btn-ghost" data-act="st" data-v="absente">Marquer absente</button>';
    } else acts += '<button class="btn btn-sage wide" data-act="st" data-v="confirme">Rétablir (confirmer)</button>';
    var cli = r.type !== 'massage' && (r.prenom || r.nom) ? '<button class="cli-link" data-act="rdv-client">' + I.user + '<span>Voir la fiche cliente</span>' + I.chevronR + '</button>' : '';
    return '<div class="d-head"><div><h3>' + esc(fullName(r) || (r.type === 'massage' ? 'Modelage' : 'Cliente')) + '</h3>' +
      '<div class="d-when">' + esc(dateLong(r.date)) + ' · <span class="mono">' + (showFin() ? hplage(r.debut, r.fin) : hfr(r.debut) + ' · fin ' + hfr(r.fin)) + '</span></div></div><span class="pill ' + r.statut + '">' + STATUT[r.statut] + '</span></div>' +
      '<div class="segs">' + segs + '</div>' + cli + '<dl class="dl">' + dl + '</dl>' +
      '<div class="field"><label for="rdv-note">Note</label><textarea id="rdv-note" class="inp" data-k="note" maxlength="300" placeholder="Allergie, déco souhaitée, rappel…">' + esc(note) + '</textarea>' +
      (v.note != null && v.note !== (r.note || '') ? '<button class="btn btn-ink btn-sm" data-act="save-note" style="align-self:flex-end">Enregistrer la note</button>' : '') + '</div>' +
      '<div class="acts">' + acts + '</div>' +
      '<div class="danger-zone"><button class="link-btn" data-act="del" style="color:var(--danger)">Supprimer définitivement</button></div>';
  };
  v.onRefresh = function () { if (S.data) { var nr = S.data.rdvs.filter(function (x) { return x.id === id; })[0]; if (nr) S.cache[id] = nr; } if (v.note == null) repaint(v); };
  v.onInput = function (el) {
    if (el.dataset.k === 'note') {
      var had = v.note != null && v.note !== (findRdv(id).note || '');
      v.note = el.value;
      var has = v.note !== (findRdv(id).note || '');
      if (had !== has) { var pos = el.selectionStart; repaint(v); var t = $('#rdv-note', v.layer); if (t) { t.focus(); t.setSelectionRange(pos, pos); } }
    }
  };
  v.on = function (act, el) {
    var r = findRdv(id);
    if (act === 'st') { setStatut(r, el.dataset.v); return true; }
    if (act === 'rdv-client') { openClient(cleOf(r)); return true; }
    if (act === 'save-note') {
      var done = function (nr) { S.cache[id] = nr; v.note = null; repaint(v); toast('Note enregistrée', 'ok'); changed({ id: id }); };
      A('admin.modifierRdv', { id: id, note: v.note }).then(done, function (e) {
        if (e.code === 'conflit') return A('admin.modifierRdv', { id: id, note: v.note, forcer: true }).then(done, fail);
        fail(e);
      });
      return true;
    }
    if (act === 'move') { openSheet(moveView(r), true); return true; }
    if (act === 'edit-svc') { openSheet(editSvcView(r), true); return true; }
    if (act === 'del') {
      dialog({ title: 'Supprimer définitivement ?', text: fullName(r) + ', ' + dateShort(r.date) + ' ' + hfr(r.debut) + '.\nCette action est irréversible. Pour garder une trace, utilisez plutôt « Annuler ».', ok: 'Supprimer', danger: true }).then(function (ok) {
        if (!ok) return;
        A('admin.supprimerRdv', { id: id }).then(function () { delete S.cache[id]; closeGroup(v); toast('Rendez-vous supprimé'); changed({ id: id }); }, fail);
      });
      return true;
    }
  };
  return v;
}
function setStatut(r, statut, forcer) {
  var prev = r.statut;
  var go = function (f) {
    return A('admin.statut', { id: r.id, statut: statut, forcer: !!f }).then(function (nr) {
      S.cache[nr.id] = nr;
      var msg = { confirme: prev === 'en_attente' ? 'Rendez-vous validé' : 'Rendez-vous confirmé', refuse: 'Demande refusée', annule: 'Rendez-vous annulé', absente: 'Marquée absente' }[statut];
      toast(msg, 'ok', statut !== 'confirme' ? { label: 'Rétablir', fn: function () { setStatut(nr, prev); } } : null);
      stack.forEach(function (v) { if (!v.raw) repaint(v); });
      changed({ id: nr.id });
      if (S.tab === 'attente') loadAttente(true);
    }, function (e) {
      if (e.code === 'conflit' && !f) return askForce(e.message).then(function (ok) { if (ok) go(true); });
      fail(e);
    });
  };
  if (statut === 'annule') {
    return dialog({ title: 'Annuler ce rendez-vous ?', text: fullName(r) + ', ' + dateShort(r.date) + ' à ' + hfr(r.debut) + '.\nLe créneau sera libéré. Pensez à prévenir la cliente.', ok: 'Annuler le RDV', cancel: 'Garder', danger: true }).then(function (ok) { if (ok) go(forcer); });
  }
  return go(forcer);
}

/* ---- Choix de prestations ---- */
